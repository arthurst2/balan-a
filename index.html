<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Usina – Programação e Produção</title>
<style>

.ban{background:#fff;padding:12px 16px 2px;font-weight:700;font-size:19px}

.tab{border:0;background:transparent;color:var(--mut);padding:8px 14px;border-radius:999px}
.tab b{display:inline-block;width:22px;height:22px;line-height:22px;border-radius:50%;background:#e5e7eb;color:var(--ink);text-align:center;margin-right:4px;font-size:12px}
.tab.on{background:#dbeafe;color:#1d4ed8}.tab.on b{background:var(--pri);color:#fff}
.seg{display:inline-flex}.seg button,.seg input{border-radius:0;margin-left:-1px}.seg>:first-child{border-radius:8px 0 0 8px}.seg>:last-child{border-radius:0 8px 8px 0}

.seg input{font:inherit;border:1px solid #d1d5db;padding:6px 8px}
.pad{max-width:1240px;margin:0 auto;padding:14px 16px 60px;overflow-x:auto}
.tip{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;border-radius:10px;padding:9px 12px;margin:0 0 12px;font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card.hl{border-color:#93c5fd;background:#f8fbff}
.ct{font-weight:700;font-size:16px;margin-bottom:8px}
.sec{font-weight:700;font-size:16px;margin:22px 0 8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sec.gap{margin-top:26px}
details>summary{cursor:pointer;font-weight:600;color:#374151;padding:8px 2px}

.chk{display:inline-flex;align-items:center;gap:6px;margin:6px 14px 6px 0;font-weight:600}
.chk.ok{color:var(--ok)}.chk.wait{color:var(--warn)}
.stline{margin:8px 0;min-height:30px}
table{border-collapse:separate;border-spacing:0;width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
th{background:#f9fafb;color:var(--mut);font-size:12px;font-weight:700;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:2px 4px;vertical-align:middle}
tr:last-child>td{border-bottom:0}
td input,td select{width:100%;border:1px solid transparent;border-radius:6px;background:transparent;font:inherit;padding:6px 8px;min-width:46px;color:inherit}
td input:focus,td select:focus,.fld input:focus,.fld select:focus{outline:2px solid #93c5fd;background:#fff}
td input[type=checkbox]{width:auto}
td.c{text-align:center}
td input[data-t]{width:66px;min-width:66px;text-align:center}
tr.pend>td{background:#fff7ed}tr.done>td{background:#f0fdf4}tr.ult>td{background:#f5f3ff}
tr.det>td{background:#fafafa;padding:10px 12px}
.ob{padding:12px 14px;border-left:5px solid #22c55e}.ob.aguarda{border-left-color:#f59e0b;background:#fffdf7}.ob.atenc{border-color:#fca5a5;border-left-color:var(--bad)}
.obh{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hora{font-size:24px;font-weight:700;min-width:70px}
.obm{flex:1;min-width:200px}.obc{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.atn{color:var(--bad);font-weight:600;margin-top:2px}
.acts{display:flex;gap:8px;margin-top:6px}
.sem{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.dia{flex:1;min-width:92px;border:1px solid var(--line);border-radius:10px;text-align:center;padding:6px 4px;cursor:pointer;background:#fff;font-size:13px}

.dia.g{border-bottom:4px solid #22c55e}.dia.y{border-bottom:4px solid #f59e0b}.dia.r{border-bottom:4px solid var(--bad)}
.tl{display:flex;gap:2px;margin-bottom:4px}
.sl{flex:1;min-width:26px;text-align:center;border-radius:6px;padding:2px 0;font-size:12px}
.sl b{display:block;height:14px;font-size:10px}.sl span{font-weight:700;font-size:15px;display:block}.sl small{font-size:10px}
.sl.g{background:#dcfce7}.sl.y{background:#fef3c7}.sl.r{background:#fee2e2;color:#991b1b}
i.gap{flex:0 0 12px;border:0}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}.kpi small{color:var(--mut);display:block}.kpi b{font-size:22px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.pill{border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;background:#fef3c7;color:#92400e}.pill.ok{background:#dcfce7;color:#166534}
.fila{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.chip{border-radius:8px;padding:4px 9px;font-weight:600;cursor:grab;user-select:none;margin-bottom:4px;border:1px solid rgba(0,0,0,.15)}
.leg{font-size:12px;color:var(--mut)}
.x{color:var(--bad);font-weight:700;cursor:pointer;text-align:center;padding:0 6px}
.hint{font-size:12px;color:var(--mut)}
.pn{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:8px 0}
.pc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;min-width:0}
.ph{font-weight:700;padding:4px 8px;border-radius:8px;margin-bottom:6px}
.pc .chip{display:block}
.mb{padding:2px 8px;margin:0 2px;font-size:12px;border-radius:6px}
.tg{display:inline-block;color:#fff;padding:1px 7px;font-size:11px;font-weight:700;white-space:nowrap;margin:2px 4px 0 0;border-radius:999px}
.late{background:#fee2e2!important;color:#991b1b}.soon{background:#fef3c7!important}
.hd{cursor:grab;color:var(--mut);white-space:nowrap;text-align:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.ovc{background:#fff;border-radius:14px;max-width:560px;padding:20px 22px;margin:16px}
.ovc li{margin:8px 0}
details>summary.sec::after{content:'▾';color:var(--mut)}
details[open]>summary.sec::after{content:'▴'}
.stsel{font-size:11px;margin-left:6px;padding:0 2px;border-radius:6px;border:1px solid rgba(0,0,0,.2);background:#fff}
</style></head><body>

<script>
const $=s=>document.querySelector(s),K='usina_v1';
// Preencha com o Project URL e a chave PUBLISHABLE (sb_publishable_...) do Supabase (Project Settings > API Keys). NUNCA use a chave secret/service_role. Em branco = o site funciona só neste navegador.
const SB={url:'https://larcovmucjuaurvwwoly.supabase.co',key:'sb_publishable_0YGmWQR2dWZ_RRLKXmvwMw_5jTekCCX'};SB.url=SB.url.replace(/\/rest\/v1\/?$/,'').replace(/\/+$/,'');
const pad=n=>String(n).padStart(2,'0');

const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),tv=o=>(+o.m3||0)*(+o.vm3||0)+(o.bomba?+o.taxa||0:0);
const uid=()=>Math.random().toString(36).slice(2,9);
const COR=['#FF0000','#00B0F0','#7030A0','#92D050','#ED7D31','#FFC000','#0070C0','#FF66CC','#00B050','#A5A5A5','#C55A11','#2F5597'];
const tc=c=>{const n=parseInt(c.slice(1),16),l=.299*(n>>16)+.587*(n>>8&255)+.114*(n&255);return l>150?'#000':'#fff'};
const DIAS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function defaults(){
 const B=[['Manoel /Thiago','EOF-6045','10:00','BE10','Bomba',0],['João Pedro /Marcos/João','OOZ-1C55','06:00','BE05','Bomba',0],['Sandro/François','HEM-8064','06:20','BE03','Bomba',0],
 ['Silvano','OMX-5E46','06:00','99','Betoneira',0],['Raffael','FRU 6C05','06:20','107','Betoneira',0],['Ivonildes','QIF 0259','06:20','105','Betoneira',0],['Rosenvaldo','FRU 5C48','06:40','108','Betoneira',0],['Guilherme','TMG8E42','07:00','6','Betoneira',0],['Gilvane','FIP9721','07:00','97','Betoneira',0],['Claudemir','QDS9D70','07:20','104','Betoneira',0],['Gabriel','OXI7E37','11:00','106','Betoneira',1],['','FEJ 8J52','07:00','100','Betoneira',1]];
 return{cfg:{mh:24,ida:60,desc:60},
 frota:B.map((b,i)=>({id:uid(),mot:b[0],placa:b[1],entrada:b[2],cod:b[3],tipo:b[4],manut:!!b[5],cor:COR[i]})),
 staff:[{id:uid(),cat:'Pazeiro',nome:'Pedro',hora:'06:00'},{id:uid(),cat:'Programação/Balança',nome:'Carlos Henrique',hora:'06:00'},{id:uid(),cat:'Férias',nome:'Adelvice',hora:''},{id:uid(),cat:'Banco de hora',nome:'Milton',hora:''}],
 obras:[],prod:{},acum:{}}}
let S;
try{S=JSON.parse(localStorage.getItem(K))}catch(_){}
if(!S||!S.frota)S=defaults();
function mig(){S.ui=S.ui||{};S.ov=S.ov||{};S.man=S.man||{};S.cfg.dias=S.cfg.dias||[1,2,3,4,5,6];if(S.cfg.sent===undefined)S.cfg.sent=1;if(!S.rod){S.rod={base:dstr(new Date()),slots:{}};['Bomba','Betoneira'].forEach(t=>S.rod.slots[t]=S.frota.filter(f=>f.tipo==t&&!f.manut).map(f=>f.entrada))}
 if(S.cfg.lc===undefined){S.cfg.lc=40;S.cfg.ld=60}
 if(S.cfg.bv===undefined)Object.assign(S.cfg,{bv:30,bm:20,bl:20,vel:35,coord:{DF:'-15.7943692, -47.8511954',GO:''}});
 if(!S.mots){S.mots=S.frota.filter(f=>String(f.mot||'').trim()).map(f=>({id:uid(),nome:f.mot,tipo:f.tipo,vid:f.id,au_t:f.au_t,au_de:f.au_de,au_ate:f.au_ate}));Object.values(S.ov).forEach(o=>S.mots.forEach(d=>{if(o[d.vid])o[d.id]=o[d.vid]}))}
 S.asg=S.asg||{};
 if(!S.locDF){S.locDF=[];S.locGO=[];S.par=[]}
 if(!S.locSeed){seedLoc();S.locSeed=1}
 if(!S.cf2){const h=dstr(new Date());S.obras.forEach(o=>{if(o.conf===undefined||o.data>=h)o.conf=false});S.cf2=1}
 S.esc=S.esc||{};if(S.rst2===undefined){resetPlanilha('2026-11-08');S.rst=1;S.rst2=1}
 if(!S.us1){Object.keys(S.prod||{}).forEach(k=>{if(k.length>10){const d=k.slice(0,10),u=k.slice(10);S.prod[d]=(S.prod[d]||[]).concat((S.prod[k]||[]).map(r=>({...r,us:r.us||u})));delete S.prod[k]}});['pa','man'].forEach(n=>{const o=S[n]=S[n]||{};Object.keys(o).forEach(k=>{if(k.length>10){o[k.slice(0,10)]=o[k];delete o[k]}})});S.obras.forEach(o=>{o.usina=''});S.us1=1}
 
 if(!S.clr1){S.obras=[];S.prod={};S.pa={};S.man={};S.clr1=1}}mig();
let UI={op:{},tab:'prog',usina:'',data:dstr(new Date()),nf:{hora:'08:00',cliente:'',vendedor:'',local:'',peca:'',fck:25,slump:'12±2',m3:16,vm3:'',taxa:'',perc:20,bomba:false}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(_){}push()};
const gap=()=>Math.max(5,Math.round(8/S.cfg.mh*60));
const cic=o=>S.cfg.ida+S.cfg.desc+2*(+o.perc||0);
const cargas=o=>{const n=Math.max(1,Math.ceil((+o.m3||8)/8)),g=gap();return Array.from({length:n},(_,k)=>{const s=t2m(o.hora)+k*g;return[s,s+cic(o)]})};
const disp=tipo=>S.frota.filter(f=>f.tipo==tipo&&!f.manut).length;
function uso(data,us,extra){
 const os=S.obras.filter(o=>o.data==data&&o.usina==us);if(extra)os.push(extra);
 const bt=Array(24).fill(0),bb=Array(24).fill(0);
 os.forEach(o=>{const cs=cargas(o);
  cs.forEach(([a,b])=>{for(let i=0;i<24;i++){const s=360+i*30;if(a<=s&&b>s)bt[i]++}});
  if(o.bomba){const x=S.cfg.ida+(+o.perc||0),a=cs[0][0]+x,b=cs[cs.length-1][0]+x+S.cfg.desc;for(let i=0;i<24;i++){const s=360+i*30;if(a<=s&&b>s)bb[i]++}}});
 return{bt,bb}}
function status(data,us,o){
 const u=uso(data,us,o),cs=cargas(o),a=cs[0][0],b=cs[cs.length-1][1];let r='cabe';
 for(let i=0;i<24;i++){const s=360+i*30;if(s+30<=a||s>=b)continue;
  const l=disp('Betoneira',s,data)-u.bt[i];if(l<0)return'cheio';if(l==0)r='apertado';
  if(o.bomba){const lb=disp('Bomba',s,data)-u.bb[i];if(lb<0)return'cheio';if(lb==0)r='apertado'}}
 return r}
function sugere(data,us,o){const t=t2m(o.hora);for(let d=15;d<=720;d+=15)for(const x of[t+d,t-d]){if(x<360||x>1020)continue;if(status(data,us,{...o,hora:m2t(x)})=='cabe')return m2t(x)}return null}
function readNF(){const g=i=>document.getElementById('nf-'+i);return{hora:nt(g('hora').value)||'08:00',cliente:g('cliente').value,vendedor:g('vendedor').value,local:g('local').value,peca:g('peca').value,fck:g('fck').value,slump:g('slump').value,m3:+g('m3').value||0,vm3:+g('vm3').value||0,end:g('end').value,brita:g('brita').value,obs:g('obs').value,conf:g('conf').checked,at:g('at').checked,taxa:+g('taxa').value||0,perc:+g('perc').value||0,bomba:g('bomba').checked}}
function aviso(){
 const el=$('#st');if(!el)return;const o=readNF();UI.nf=o;
 if(!o.m3){el.innerHTML='';return}
 const s=status(UI.data,UI.usina,o);let h=`<span class="badge ${s}">${s=='cabe'?'✔ Cabe':s=='apertado'?'⚠ No limite':'✖ Sem caminhão livre'}</span>`;
 if(s!='cabe'){const g=sugere(UI.data,UI.usina,o);h+=g?` <span class="hint">Horário livre mais próximo: <b>${g}</b> <button onclick="usaH('${g}')">Usar</button></span>`:' <span class="hint">Sem horário livre neste dia.</span>'}
 if(o.local&&!locMin(o.local)&&o.perc>0)h+=` <button class="mb" onclick="salvaLoc()">Salvar “${e(o.local)}” (${o.perc} min) na lista de locais</button>`;
 const p=o.perc<=20?'Perto':o.perc<=40?'Médio':'Longe';
 el.innerHTML=h+` <span class="hint">${p} da usina · ciclo ${Math.floor(cic(o)/60)}h${pad(cic(o)%60)}</span>`}
const usaH=h=>{$('#nf-hora').value=h;aviso()};
function addObra(){const o=readNF();if(!o.cliente&&!o.m3)return;const reps=(UI.rep&&UI.rep.nf)||[];
 S.obras.push({...o,id:uid(),data:UI.data,usina:UI.usina});reps.forEach(d=>S.obras.push({...o,id:uid(),data:d,usina:UI.usina,conf:false,cx:[]}));gerarDia(UI.data);reps.forEach(d=>gerarDia(d));if(UI.rep)UI.rep.nf=[];

function togRep(k,d){UI.rep=UI.rep||{};const a=new Set(UI.rep[k]||[]);a.has(d)?a.delete(d):a.add(d);UI.rep[k]=[...a]}

function repetirMulti(id){const o=find('obras',id);if(!o)return;const a=(UI.rep||{})[id]||[];a.forEach(d=>S.obras.push({...o,id:uid(),data:d,conf:false,at:false,atn:'',cx:[]}));a.forEach(d=>gerarDia(d));UI.rep[id]=[];UI.op['rp'+id]=false;save();render()}
const livreDe=r=>r.livre||((r.real||r.prog)?m2t(t2m(r.real||r.prog)+S.cfg.lc+S.cfg.ld):'');
const novaLinha=()=>{const k=UI.data+UI.usina;(S.prod[k]=S.prod[k]||[]).push({id:uid(),prog:'',real:'',ped:'',cli:'',loc:'',peca:'',vend:'',m3:8,fck:'',slump:'',perc:20,cam:'',bomba:'',livre:'',obs:'',us:'DF'});save();render()};
function del(k,id){if(k=='obras'){const o0=S.obras.find(o=>o.id==id);S.obras=S.obras.filter(o=>o.id!=id);if(o0)gerarDia(o0.data)}else if(k=='prod'){const a=S.prod[UI.data+UI.usina];S.prod[UI.data+UI.usina]=a.filter(r=>r.id!=id)}else S[k]=S[k].filter(o=>o.id!=id);save();render()}
function find(k,id){return k=='prod'?(S.prod[UI.data+UI.usina]||[]).find(r=>r.id==id):S[k].find(o=>o.id==id)}
document.addEventListener('change',ev=>{const t=ev.target,k=t.dataset.k;if(t.dataset.t)t.value=nt(t.value);if(t.id=='nf-local'){const m=locMin(t.value);if(m)$('#nf-perc').value=m}if(t.id&&t.id.startsWith('nf-')){aviso();return}
 if(t.dataset.ov){ovSet(t.dataset.i,t.dataset.ov,t.value);return}if(t.dataset.coord){S.cfg.coord[t.dataset.coord]=t.value;save();render();return}if(t.dataset.slot){S.rod.slots[t.dataset.slot]=t.value.split(/[ ,;]+/).map(nt).filter(Boolean);save();render();return}if(t.dataset.dia!==undefined){const d=+t.dataset.dia,a=S.cfg.dias;S.cfg.dias=t.checked?[...new Set([...a,d])]:a.filter(x=>x!=d);save();render();return}if(t.dataset.cfg){S.cfg[t.dataset.cfg]=+t.value||0;save();render();return}

 const used=Array(24).fill(0),bs=S.frota.filter(f=>f.tipo=='Bomba'&&!f.manut).map(f=>({f,livre:0,ult:null,pg:null}));
 const sl=(i,f)=>{const r=[];for(let k=0;k<24;k++){const s=360+k*30;if(i<s+30&&f>s)r.push(k)}return r};
 return os.map(o=>{
  const av=[],n=Math.max(1,Math.ceil((+o.m3||8)/8)),g=o.bomba?Math.max(g0,Math.round(8/S.cfg.bv*60)):g0,c=cic(o),t0=t2m(o.hora),need=Math.min(n,Math.max(1,Math.ceil(c/g)));
  const dur=k=>k>=need?(n-1)*g+c:Math.ceil(n/k)*c,fr=(i,f)=>Math.min(nB,...sl(i,f).map(k=>nB-used[k]));
  if(!o.conf)av.push('vendedor ainda não confirmou');if(o.at)av.push('ATENÇÃO: '+(o.atn||'obra fora do padrão'));const free=fr(t0,t0+dur(need)),a=Math.max(0,Math.min(need,free));let fim=t0+dur(a||need);
  if(a==0){let px=null;for(let t=t0+30;t<=1080&&!px;t+=30)if(fr(t,t+dur(need))>=need)px=m2t(t);av.push('nenhuma betoneira livre neste horário'+(px?' — começar às '+px+' resolve':''))}
  else{if(a<need)av.push('só '+a+' de '+need+' betoneiras livres: ritmo reduzido, termina ~'+m2t(fim));sl(t0,fim).forEach(k=>used[k]+=a)}
  let bomba='';

   const gO=o.local,tp=t0+S.cfg.ida+(+o.perc||0),bi=tp-S.cfg.bm,bf=tp+Math.ceil((+o.m3||0)/S.cfg.bv*60)+S.cfg.bl;
   if(!bs.length)av.push('nenhuma bomba disponível');
   else{
    const op=bs.map(p=>{const dir=p.ult&&p.pg&&gO?dd(p.pg,gO):null,via=p.ult?(+p.ult.perc||0)+(+o.perc||0):(+o.perc||0),tf=dir??via,volta=p.ult?(+p.ult.perc||0):0;
     return{p,tf,dir,eco:dir!=null?volta+(+o.perc||0)-dir:0,atraso:Math.max(0,p.livre+tf-bi)}}).sort((x,y)=>x.atraso-y.atraso||y.eco-x.eco||x.tf-y.tf)[0],p=op.p,nm=(p.f.cod||'')+' '+(p.f.placa||'');

    if(op.atraso>0)av.push('bomba '+nm.trim()+' só chega ~'+op.atraso+' min depois do necessário');

  return{o,need,aloc:a,fim,bomba,av}})}

 ${dt('cap','CAPACIDADE E BACKUP',`<table style="width:auto"><tr><th>m³/h da central</th><th>Ida fixa (min)</th><th>Descarga (min)</th><th>Carregar (min) — livre às</th><th>Descarregar (min) — livre às</th></tr><tr><td><input type="number" data-cfg="mh" value="${S.cfg.mh}"></td><td><input type="number" data-cfg="ida" value="${S.cfg.ida}"></td><td><input type="number" data-cfg="desc" value="${S.cfg.desc}"></td><td><input type="number" data-cfg="lc" value="${S.cfg.lc}"></td><td><input type="number" data-cfg="ld" value="${S.cfg.ld}"></td></tr></table><table style="width:auto"><tr><th>Vazão da bomba (m³/h)</th><th>Montar (min)</th><th>Lavar (min)</th></tr><tr><td><input type="number" data-cfg="bv" value="${S.cfg.bv}"></td><td><input type="number" data-cfg="bm" value="${S.cfg.bm}"></td><td><input type="number" data-cfg="bl" value="${S.cfg.bl}"></td></tr></table><div class="hint" style="margin:4px 0">Intervalo entre cargas: ${gap()} min (8 m³ ÷ m³/h). Ciclo (cabe/apertado) = ida fixa + descarga + 2 × percurso.</div><button onclick="backup()">Baixar backup</button> <label class="hint"><button onclick="this.nextElementSibling.click()">Restaurar backup</button><input type="file" accept=".json" hidden onchange="restaurar(this.files[0])"></label>`)}`}
function render(){if(SB.url&&window.supabase&&!me){loginView();return}if(UI.tab=='prod'&&!(S.prod[UI.data]||[]).length&&S.obras.some(o=>o.data==UI.data)){gerarDia(UI.data);save()}
if(UI.tab=='prod'&&limpaDup(UI.data))save();head();$('#app').innerHTML=UI.tab=='prog'?prog():UI.tab=='prod'?prod():eq();if(UI.tab=='prog')aviso();if(!UI.hs){UI.hs=1;try{if(!localStorage.getItem('usina_help'))ajuda()}catch(_){}}}
// ---------- sincronização online (Supabase) ----------
let sb=null,me=null,ch=null,pt=null,rt=null,SNAP={},ST='',LIM='',OM={};
const ORD=['mots','frota'],KV=['us1','rst2','cfg','rod','esc','asg','ov','man','pa','acum','rst','cf2','clr1','locSeed'];
function sync(t){ST=t;const b=$('#sy');if(b)b.textContent=t}
function sbar(){return me?`<span style="margin-left:12px;font-size:12px"><span id="sy">${e(ST)}</span> · ${e(me.email)} <button onclick="atualizar()" title="Buscar agora as alterações do seu colega">↻ Atualizar</button> <button onclick="sair()">Sair</button></span>`:''}
function items(){
 const m={},put=(kind,id,data,dia)=>m[kind+':'+id]={kind,id,data,dia};
 ['obras','frota','mots','staff','locDF','locGO','par'].forEach(k=>(S[k]||[]).forEach((x,i)=>{const o=ORD.includes(k);if(o)OM[k+':'+x.id]=i;put(k,x.id,o?{d:x,o:i}:{d:x},k=='obras'?x.data:null)}));
 Object.entries(S.prod||{}).forEach(([k,a])=>a.forEach((r,i)=>{OM['prod:'+r.id]=i;put('prod',r.id,{d:r,k},k.slice(0,10))}));
 KV.forEach(k=>{if(S[k]!==undefined)put('kv',k,{v:S[k]},null)});
 return m}
function aplica(kind,id,data,del){
 if(kind=='kv'){if(del)delete S[id];else S[id]=data.v;return}
 const key=kind+':'+id,srt=a=>a.sort((x,y)=>(OM[kind+':'+x.id]??1e9)-(OM[kind+':'+y.id]??1e9));
 if(kind=='prod'){for(const k in S.prod){const i=S.prod[k].findIndex(r=>r.id==id);if(i>=0)S.prod[k].splice(i,1)}
  if(del){delete OM[key];return}const a=S.prod[data.k]=S.prod[data.k]||[];a.push(data.d);return}
 const a=S[kind]=S[kind]||[],i=a.findIndex(x=>x.id==id);
 if(del){if(i>=0)a.splice(i,1);delete OM[key];return}
 if(i>=0)a[i]=data.d;else a.push(data.d);
 if(ORD.includes(kind)){OM[key]=data.o;srt(a)}}
let LS='1970-01-01T00:00:00Z',tk=0,busy=0,rc=null;
const hora=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())};
function refresh(){clearTimeout(rt);rt=setTimeout(()=>{mig();rr()},120)}
function push(now){if(!sb||!me)return;clearTimeout(pt);if(now)return doPush();pt=setTimeout(doPush,250)}
async function doPush(){
 const cur=items(),up=[],del={};
 for(const k in cur)if(SNAP[k]!==JSON.stringify(cur[k].data))up.push(cur[k]);
 for(const k in SNAP)if(!(k in cur)){const i=k.indexOf(':');(del[k.slice(0,i)]=del[k.slice(0,i)]||[]).push(k.slice(i+1))}
 if(!up.length&&!Object.keys(del).length)return;
 sync('salvando…');
 const falha=m=>{sync('sem conexão ('+m+') — tentando de novo');clearTimeout(pt);pt=setTimeout(doPush,4000)};
 for(let i=0;i<up.length;i+=500){const{error}=await sb.from('items').upsert(up.slice(i,i+500).map(u=>({kind:u.kind,id:u.id,data:u.data,dia:u.dia||null})),{onConflict:'kind,id'});if(error)return falha(error.message)}
 for(const kd in del){const{error}=await sb.from('items').delete().eq('kind',kd).in('id',del[kd]);if(error)return falha(error.message)}
 up.forEach(u=>SNAP[u.kind+':'+u.id]=JSON.stringify(u.data));for(const kd in del)del[kd].forEach(id=>delete SNAP[kd+':'+id]);
 sync('salvo '+hora())}
async function carrega(q){
 sync('carregando…');LIM=dstr(new Date(Date.now()-120*864e5));const rows=[];
 for(let a=0;;a+=1000){const{data,error}=await sb.from('items').select('kind,id,data,dia,updated_at').or('dia.is.null,dia.gte.'+LIM).order('kind').order('id').range(a,a+999);if(error){sync('erro: '+error.message);render();return}rows.push(...data);if(data.length<1000)break}
 LS=rows.reduce((m,r)=>r.updated_at&&r.updated_at>m?r.updated_at:m,'1970-01-01T00:00:00Z');
 if(rows.length){S={cfg:{},frota:[],mots:[],staff:[],locDF:[],locGO:[],par:[],obras:[],prod:{},acum:{}};OM={};rows.forEach(r=>aplica(r.kind,r.id,r.data,false));mig();try{localStorage.setItem(K,JSON.stringify(S))}catch(_){}SNAP={};const c=items();for(const k in c)SNAP[k]=JSON.stringify(c[k].data)}
 else{SNAP={};await doPush()}
 if(!ch)assina();sync('online · '+hora());render()}
async function puxa(){
 if(!sb||!me||busy)return;busy=1;
 try{const{data,error}=await sb.from('items').select('kind,id,data,dia,updated_at').gt('updated_at',LS).order('updated_at').limit(500);if(error)throw error;let mud=false;
  for(const r of data){if(r.updated_at>LS)LS=r.updated_at;const key=r.kind+':'+r.id,x=JSON.stringify(r.data);if(SNAP[key]===x||(r.dia&&r.dia<LIM))continue;aplica(r.kind,r.id,r.data,false);SNAP[key]=x;mud=true}
  if(mud){try{localStorage.setItem(K,JSON.stringify(S))}catch(_){}refresh()}
  if(/^(sem|recon)/.test(ST))sync('online · '+hora())}catch(e){}
 busy=0}
async function reconcilia(){
 if(!sb||!me||busy)return;busy=1;
 try{const lim=dstr(new Date(Date.now()-7*864e5)),rem=new Set();
  for(let a=0;;a+=1000){const{data,error}=await sb.from('items').select('kind,id').or('dia.is.null,dia.gte.'+lim).order('kind').order('id').range(a,a+999);if(error)throw error;data.forEach(r=>rem.add(r.kind+':'+r.id));if(data.length<1000)break}
  const cur=items();let mud=false;for(const k in cur){const it=cur[k];if((it.dia&&it.dia<lim)||rem.has(k)||!(k in SNAP))continue;aplica(it.kind,it.id,null,true);delete SNAP[k];mud=true}
  if(mud){try{localStorage.setItem(K,JSON.stringify(S))}catch(_){}refresh()}}catch(e){}
 busy=0}
async function atualizar(){if(!sb||!me){render();return}sync('atualizando…');await doPush();await carrega(true)}
function assina(){
 if(ch){sb.removeChannel(ch);ch=null}
 ch=sb.channel('items').on('postgres_changes',{event:'*',schema:'public',table:'items'},p=>{
  const r=p.eventType=='DELETE'?p.old:p.new,key=r.kind+':'+r.id;
  if(p.eventType=='DELETE'){if(!(key in SNAP))return;aplica(r.kind,r.id,null,true);delete SNAP[key]}
  else{const x=JSON.stringify(r.data);if(SNAP[key]===x||(r.dia&&r.dia<LIM))return;aplica(r.kind,r.id,r.data,false);SNAP[key]=x}
  try{localStorage.setItem(K,JSON.stringify(S))}catch(_){}refresh()}).subscribe(st=>{if(st=='SUBSCRIBED')sync('online · '+hora());else if(st=='CHANNEL_ERROR'||st=='TIMED_OUT'||st=='CLOSED'){sync('reconectando…');clearTimeout(rc);rc=setTimeout(assina,4000)}})}
function loginView(){$('#ban').textContent='Usina de Planaltina';$('#bar').innerHTML='';$('#app').innerHTML=`<div class="card" style="max-width:340px;margin:40px auto"><div class="ct">Entrar</div><div class="grid" style="grid-template-columns:1fr"><label class="fld"><span>E-mail</span><input id="lg-e" type="email"></label><label class="fld"><span>Senha</span><input id="lg-s" type="password" onkeydown="if(event.key=='Enter')entrar()"></label></div><button class="pri" style="width:100%" onclick="entrar()">Entrar</button><div id="lg-m" style="color:#dc2626;margin-top:8px"></div></div>`}
async function entrar(){const{data,error}=await sb.auth.signInWithPassword({email:$('#lg-e').value.trim(),password:$('#lg-s').value});if(error){$('#lg-m').textContent='E-mail ou senha incorretos.';return}me=data.user;carrega()}
async function sair(){await sb.auth.signOut();me=null;if(ch){sb.removeChannel(ch);ch=null}render()}
function start(){if(SB.url&&window.supabase){sb=window.supabase.createClient(SB.url,SB.key);setInterval(()=>{if(!me||!sb||document.visibilityState=='hidden')return;puxa();if(++tk%7==0)reconcilia()},8000);document.addEventListener('visibilitychange',()=>{if(me&&sb&&document.visibilityState=='visible')puxa()});sb.auth.getSession().then(({data})=>{if(data.session){me=data.session.user;carrega()}else render()})}else render()}
start();
</script></body></html>
