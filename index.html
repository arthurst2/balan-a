<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">

<style>

body{margin:0;background:#E7E6E6;color:#000;font:13px Arial,Helvetica,sans-serif}

.tab.on{background:#FFFF00}
.pad{padding:8px;overflow-x:auto}

td.c{text-align:center;padding:3px}
tr.nf td{background:#FFF2CC}
.sem{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.dia{flex:1;min-width:84px;border:1px solid #333;text-align:center;padding:4px;cursor:pointer;background:var(--cz)}
.dia.on{outline:3px solid #000}
.dia.g{border-bottom:6px solid #00B050}.dia.y{border-bottom:6px solid #FFC000}.dia.r{border-bottom:6px solid #FF0000}
.tl{display:flex;gap:2px;margin-bottom:4px}
.sl{flex:1;min-width:26px;text-align:center;border:1px solid #333;padding:2px 0;font-size:12px}
.sl b{display:block;height:14px;font-size:10px}.sl span{font-weight:700;font-size:15px;display:block}.sl small{font-size:10px}
.sl.g{background:#92D050}.sl.y{background:#FFC000}.sl.r{background:#FF0000;color:#fff}
.gap{flex:0 0 18px;background:transparent}
i.gap{border:0}
.badge{display:inline-block;padding:3px 10px;font-weight:700;border:1px solid #333}
.badge.cabe{background:#92D050}.badge.apertado{background:#FFC000}.badge.cheio{background:#FF0000;color:#fff}
.tot{display:flex;flex-wrap:wrap;gap:0;margin-bottom:6px}
.tot div{border:1px solid #333;padding:4px 10px;background:#9DC3E6;font-weight:700}
.tot .o{background:#ED7D31}.tot .y{background:#FFFF00}
.tot input{width:90px;font:inherit;font-weight:700}
.fila{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.chip{border:1px solid #000;padding:3px 8px;font-weight:700;cursor:grab;user-select:none}
.leg{font-size:11px;color:#333;margin:2px 0 6px}
.x{color:#a00;font-weight:700;cursor:pointer;text-align:center;padding:0 6px}
.hint{font-size:11px;margin-left:6px}

.pn{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px;margin-bottom:8px}
.pc{border:1px solid #333;background:#F2F2F2;padding:4px;min-width:0}
.ph{font-weight:700;padding:3px;text-align:center;margin-bottom:4px;border:1px solid #333}
.pc .chip{display:block;margin-bottom:3px}
.mb{padding:0 5px;margin:0 2px;font-size:13px;line-height:22px}
</style></head><body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
const $=s=>document.querySelector(s),K='usina_v1';

const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),tv=o=>(+o.m3||0)*(+o.vm3||0)+(o.bomba?+o.taxa||0:0);
const uid=()=>Math.random().toString(36).slice(2,9);

const DIAS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function defaults(){
 const B=[['Manoel /Thiago','EOF-6045','10:00','BE10','Bomba',0],['João Pedro /Marcos/João','OOZ-1C55','06:00','BE05','Bomba',0],['Sandro/François','HEM-8064','06:20','BE03','Bomba',0],
 ['Silvano','OMX-5E46','06:00','99','Betoneira',0],['Raffael','FRU 6C05','06:20','107','Betoneira',0],['Ivonildes','QIF 0259','06:20','105','Betoneira',0],['Rosenvaldo','FRU 5C48','06:40','108','Betoneira',0],['Guilherme','TMG8E42','07:00','6','Betoneira',0],['Gilvane','FIP9721','07:00','97','Betoneira',0],['Claudemir','QDS9D70','07:20','104','Betoneira',0],['Gabriel','OXI7E37','11:00','106','Betoneira',1],['','FEJ 8J52','07:00','100','Betoneira',1]];
 return{cfg:{mh:24,ida:60,desc:60},

 obras:[],prod:{},acum:{}}}

try{S=JSON.parse(localStorage.getItem(K))}catch(_){}

function mig(){S.ui=S.ui||{};S.ov=S.ov||{};S.man=S.man||{};S.cfg.dias=S.cfg.dias||[1,2,3,4,5,6];if(S.cfg.sent===undefined)S.cfg.sent=1;if(!S.rod){S.rod={base:dstr(new Date()),slots:{}};['Bomba','Betoneira'].forEach(t=>S.rod.slots[t]=S.frota.filter(f=>f.tipo==t&&!f.manut).map(f=>f.entrada))}
 if(S.cfg.lc===undefined){S.cfg.lc=40;S.cfg.ld=60}
 if(S.cfg.bv===undefined)Object.assign(S.cfg,{bv:30,bm:20,bl:20,vel:35,coord:{DF:'-15.7943692, -47.8511954',GO:''}});
 if(!S.mots){S.mots=S.frota.filter(f=>String(f.mot||'').trim()).map(f=>({id:uid(),nome:f.mot,tipo:f.tipo,vid:f.id,au_t:f.au_t,au_de:f.au_de,au_ate:f.au_ate}));Object.values(S.ov).forEach(o=>S.mots.forEach(d=>{if(o[d.vid])o[d.id]=o[d.vid]}))}
 S.asg=S.asg||{}}mig();
let UI={op:{},tab:'prog',usina:'DF',data:dstr(new Date()),nf:{hora:'08:00',cliente:'',vendedor:'',local:'',peca:'',fck:25,slump:'12±2',m3:16,vm3:'',taxa:'',perc:20,bomba:false}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(_){}};
const gap=()=>Math.max(5,Math.round(8/S.cfg.mh*60));
const cic=o=>S.cfg.ida+S.cfg.desc+2*(+o.perc||0);
const cargas=o=>{const n=Math.max(1,Math.ceil((+o.m3||8)/8)),g=gap();return Array.from({length:n},(_,k)=>{const s=t2m(o.hora)+k*g;return[s,s+cic(o)]})};
const disp=tipo=>S.frota.filter(f=>f.tipo==tipo&&!f.manut).length;
function uso(data,us,extra){
 const os=S.obras.filter(o=>o.data==data&&o.usina==us);if(extra)os.push(extra);
 const bt=Array(24).fill(0),bb=Array(24).fill(0);
 os.forEach(o=>{const cs=cargas(o);
  cs.forEach(([a,b])=>{for(let i=0;i<24;i++){const s=360+i*30;if(a<=s&&b>s)bt[i]++}});
  if(o.bomba){const x=S.cfg.ida+(+o.perc||0),a=cs[0][0]+x,b=cs[cs.length-1][0]+x+S.cfg.desc;for(let i=0;i<24;i++){const s=360+i*30;if(a<=s&&b>s)bb[i]++}}});
 return{bt,bb}}
function status(data,us,o){
 const u=uso(data,us,o),cs=cargas(o),a=cs[0][0],b=cs[cs.length-1][1];let r='cabe';
 for(let i=0;i<24;i++){const s=360+i*30;if(s+30<=a||s>=b)continue;
  const l=disp('Betoneira',s,data)-u.bt[i];if(l<0)return'cheio';if(l==0)r='apertado';
  if(o.bomba){const lb=disp('Bomba',s,data)-u.bb[i];if(lb<0)return'cheio';if(lb==0)r='apertado'}}
 return r}
function sugere(data,us,o){const t=t2m(o.hora);for(let d=15;d<=720;d+=15)for(const x of[t+d,t-d]){if(x<360||x>1020)continue;if(status(data,us,{...o,hora:m2t(x)})=='cabe')return m2t(x)}return null}
function readNF(){const g=i=>document.getElementById('nf-'+i);return{hora:nt(g('hora').value)||'08:00',cliente:g('cliente').value,vendedor:g('vendedor').value,local:g('local').value,peca:g('peca').value,fck:g('fck').value,slump:g('slump').value,m3:+g('m3').value||0,vm3:+g('vm3').value||0,geo:g('geo').value,taxa:+g('taxa').value||0,perc:+g('perc').value||0,bomba:g('bomba').checked}}
function aviso(){
 const el=$('#st');if(!el)return;const o=readNF();UI.nf=o;
 if(!o.m3){el.innerHTML='';return}

 if(s!='cabe'){const g=sugere(UI.data,UI.usina,o);h+=g?` <span class="hint">Horário livre mais próximo: <b>${g}</b> <button onclick="usaH('${g}')">Usar</button></span>`:' <span class="hint">Sem horário livre neste dia.</span>'}
 const p=o.perc<=20?'Perto':o.perc<=40?'Médio':'Longe';

function addObra(){const o=readNF();if(!o.cliente&&!o.m3)return;{const mi=dd(pl(UI.usina),geo(o.geo));if(mi)o.perc=mi}S.obras.push({...o,id:uid(),data:UI.data,usina:UI.usina});
 UI.nf={...o,cliente:'',local:'',geo:''};save();render()}
const livreDe=r=>r.livre||((r.real||r.prog)?m2t(t2m(r.real||r.prog)+S.cfg.lc+S.cfg.ld):'');
function gerarOld(){const k=UI.data+UI.usina,P=S.prod[k]=S.prod[k]||[];
 S.obras.filter(o=>o.data==UI.data&&o.usina==UI.usina).forEach(o=>{if(P.some(r=>r.oid==o.id))return;
  const n=Math.max(1,Math.ceil(o.m3/8));
  for(let j=0;j<n;j++)P.push({id:uid(),oid:o.id,prog:m2t(t2m(o.hora)+j*gap()),real:'',ped:'',cli:o.cliente,loc:o.local,peca:o.peca,vend:o.vendedor,m3:j<n-1?8:(o.m3-8*(n-1)||8),fck:o.fck,slump:o.slump,perc:o.perc,cam:'',bomba:'',livre:'',obs:''})});
 P.sort((a,b)=>t2m(a.prog)-t2m(b.prog));save();render()}
const novaLinha=()=>{const k=UI.data+UI.usina;(S.prod[k]=S.prod[k]||[]).push({id:uid(),prog:'',real:'',ped:'',cli:'',loc:'',peca:'',vend:'',m3:8,fck:'',slump:'',perc:20,cam:'',bomba:'',livre:'',obs:''});save();render()};
function del(k,id){if(k=='obras')S.obras=S.obras.filter(o=>o.id!=id);else if(k=='prod'){const a=S.prod[UI.data+UI.usina];S.prod[UI.data+UI.usina]=a.filter(r=>r.id!=id)}else S[k]=S[k].filter(o=>o.id!=id);save();render()}
function find(k,id){return k=='prod'?(S.prod[UI.data+UI.usina]||[]).find(r=>r.id==id):S[k].find(o=>o.id==id)}
document.addEventListener('change',ev=>{const t=ev.target,k=t.dataset.k;if(t.dataset.t)t.value=nt(t.value);if(t.id&&t.id.startsWith('nf-')){aviso();return}
 if(t.dataset.ov){ovSet(t.dataset.i,t.dataset.ov,t.value);return}if(t.dataset.coord){S.cfg.coord[t.dataset.coord]=t.value;save();render();return}if(t.dataset.slot){S.rod.slots[t.dataset.slot]=t.value.split(/[ ,;]+/).map(nt).filter(Boolean);save();render();return}if(t.dataset.dia!==undefined){const d=+t.dataset.dia,a=S.cfg.dias;S.cfg.dias=t.checked?[...new Set([...a,d])]:a.filter(x=>x!=d);save();render();return}if(t.dataset.cfg){S.cfg[t.dataset.cfg]=+t.value||0;save();render();return}
 if(t.id=='acum'){S.acum[UI.data+UI.usina]=+t.value||0;save();render();return}
 if(!k)return;const it=find(k,t.dataset.i);if(!it)return;
 it[t.dataset.f]=t.type=='checkbox'?t.checked:t.type=='number'?+t.value:t.value;if(k=='obras'&&t.dataset.f=='geo'){const mi=dd(pl(it.usina),geo(it.geo));if(mi)it.perc=mi}if(k=='prod'){it.ed=it.ed||{};it.ed[t.dataset.f]=1}save();setTimeout(rr,0)});
document.addEventListener('input',ev=>{if(ev.target.id&&ev.target.id.startsWith('nf-'))aviso()});
let dg=null;
document.addEventListener('dragstart',ev=>{const t=ev.target.closest('[data-d]');if(t)dg=t.dataset.d});
document.addEventListener('dragover',ev=>{if(ev.target.closest('[data-d]'))ev.preventDefault()});
document.addEventListener('drop',ev=>{const t=ev.target.closest('[data-d]');if(!t||!dg||dg==t.dataset.d)return;ev.preventDefault();
 const ia=S.mots.findIndex(f=>f.id==dg),ib=S.mots.findIndex(f=>f.id==t.dataset.d);
 if(ia<0||ib<0||S.mots[ia].tipo!=S.mots[ib].tipo)return;const[x]=S.mots.splice(ia,1);S.mots.splice(ib,0,x);dg=null;save();render()});
function aplicar(id,f,v){const r=find('prod',id);if(!r)return;r[f]=v;save();render()}
function aplicarObra(oid,v){(S.prod[UI.data+UI.usina]||[]).filter(r=>r.oid==oid).forEach(r=>r.bomba=v);save();render()}
setInterval(()=>{const a=document.activeElement;if(UI.tab=='prod'&&!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))rr()},60000);
function proxima(){
 const D=UI.data,us=UI.usina,P=S.prod[D+us]||[],now=dstr(new Date())==D?new Date().getHours()*60+new Date().getMinutes():-1;
 if(!P.length)return'';
 const lc=S.cfg.lc,ld=S.cfg.ld,hh=m2t,rl=P.filter(r=>r.real&&r.prog).map(r=>t2m(r.real)-t2m(r.prog)).slice(-3),atr=rl.length?Math.max(0,Math.round(rl.reduce((a,b)=>a+b,0)/rl.length)):0,da=now>=0?atr:0;
 const nome=t=>((S.frota.find(x=>x.id==t.id)||{}).cod||'?')+' '+String(t.d.nome||'').split('/')[0];
 const T=ordem('Betoneira',D).filter(d=>!sit(d,D)).map(d=>({d,id:vid(d,D),en:t2m(ent(d,D)),livre:0,n:0})).filter(t=>t.id);
 P.filter(r=>r.real&&r.cam).forEach(r=>{const t=T.find(x=>x.id==r.cam);if(t){t.livre=Math.max(t.livre,t2m(livreDe(r)));t.n++}});
 const L=P.filter(r=>!r.real).sort((a,b)=>t2m(a.prog)-t2m(b.prog)).map(r=>{
  const st=Math.max(t2m(r.prog)+da,now>0?now:0),cur=r.cam?T.find(x=>x.id==r.cam):null,lv=T.filter(t=>t.livre<=st+5&&t.en<=st).sort((a,b)=>a.n-b.n);
  let tp,esc;
  if(cur&&lv.includes(cur)){tp='ok';esc=cur}else if(lv.length){esc=lv[0];tp=r.cam?'troque':'mande'}else{esc=[...T].sort((a,b)=>a.livre-b.livre)[0];tp=esc?'espera':'nada'}
  const x={r,st,tp,esc,cur,liv0:esc?esc.livre:0,n0:esc?esc.n:0};
  if(esc){esc.livre=Math.max(st,esc.livre)+lc+ld;esc.n++}
  return x});
 const P0=pl(us),Bs=S.frota.filter(f=>f.tipo=='Bomba'&&!f.manut&&!(drvOf(f.id,D)&&sit(drvOf(f.id,D),D))).map(f=>({f,livre:0,ult:null,pg:null})),pb=[];
 S.obras.filter(o=>o.data==D&&o.usina==us&&o.bomba).sort((a,b)=>t2m(a.hora)-t2m(b.hora)).forEach(o=>{
  const rs=P.filter(r=>r.oid==o.id),pend=rs.some(r=>!r.real),as=(rs.find(r=>r.bomba)||{}).bomba,gO=geo(o.geo),t0=t2m(o.hora)+(pend?da:0),tp=t0+S.cfg.ida+(+o.perc||0),bi=tp-S.cfg.bm,bf=tp+Math.ceil((+o.m3||0)/S.cfg.bv*60)+S.cfg.bl;
  const nm=q=>((q.f.cod||'')+' '+(q.f.placa||'')).trim();let p=as?Bs.find(x=>x.f.id==as):null;

   if(!op)pb.push({m:`⛔ Obra ${e(o.cliente)}: nenhuma bomba disponível`});
   else{p=op.p;pb.push({m:`🚜 Obra <b>${e(o.cliente)}</b> (${e(o.hora)}): mande a bomba <b>${e(nm(p))}</b> — ${op.dir!=null&&op.eco>0?'vem direto da obra '+e(p.ult.cliente||p.ult.local)+' ('+op.dir+' min), economiza ~'+op.eco+' min':'sai da usina ('+op.tf+' min)'}${op.atraso>0?' · ⚠ chega ~'+op.atraso+' min atrasada':''} <button class="mb" onclick="aplicarObra('${o.id}','${p.f.id}')">Usar</button>`})}}
  if(p){p.livre=bf;p.ult=o;p.pg=gO}});
 const it=L.slice(0,6).map(x=>{const r=x.r,h=`<b>${e(r.cli)||'(sem cliente)'}</b> · ${e(r.prog)}${da&&x.st>t2m(r.prog)?' (~'+hh(x.st)+')':''} · ${+r.m3||0} m³ → `,u=x.esc&&x.tp!='ok'&&x.tp!='nada'?` <button class="mb" onclick="aplicar('${r.id}','cam','${x.esc.id}')">Usar</button>`:'',cn=x.cur?nome(x.cur):((S.frota.find(v=>v.id==r.cam)||{}).cod||'')+' (sem motorista/ausente)';
  return'<div style="margin:4px 0">'+h+(x.tp=='ok'?'✔ '+e(nome(x.esc))+' está certa':x.tp=='mande'?'mande <b>'+e(nome(x.esc))+'</b> ('+(x.n0?'livre desde '+hh(x.liv0):'ainda não usada')+')'+u:x.tp=='troque'?'⚠ '+e(cn)+' não está livre — troque por <b>'+e(nome(x.esc))+'</b>'+u:x.tp=='espera'?'⏳ nenhuma betoneira livre às '+hh(x.st)+'; a primeira é <b>'+e(nome(x.esc))+'</b> às '+hh(x.liv0)+' (+'+Math.max(0,x.liv0-x.st)+' min)'+u:'⛔ sem betoneira com motorista presente')+'</div>'}).join('');

 const m=os.filter(o=>t2m(o.hora)<720),t=os.filter(o=>t2m(o.hora)>=720),sum=l=>l.reduce((a,o)=>a+(+o.m3||0),0),n=UI.nf;
 const th='<tr><th>Hora</th><th>Cliente</th><th>Vendedor</th><th>Local</th><th>Peça</th><th>FCK</th><th>Slump</th><th>m³</th><th>Valor m³ (R$)</th><th>📍 Coord. (Maps)</th><th>Percurso (min)</th><th>Bomba</th><th>Taxa bomba (R$)</th><th>Total (R$)</th><th></th></tr>';
 const dl=a=>'<datalist id="'+a[0]+'">'+[...new Set(S.obras.map(o=>o[a[1]]).filter(Boolean))].map(v=>`<option value="${e(v)}">`).join('')+'</datalist>';
 const f=(id,v,t='text',x='')=>`<td><input id="nf-${id}" type="${t=='time'?'text':t}" ${t=='time'?'data-t="1" inputmode="numeric" maxlength="5"':''} value="${e(v)}" ${x}></td>`;
 return semana()+timeline()+sugestao()+
 `<table><tr><th colspan="15" style="background:#9DC3E6;color:#000">NOVA OBRA — confira o aviso antes de confirmar</th></tr>${th}<tr class="nf">${f('hora',n.hora,'time')}${f('cliente',n.cliente,'text','list="l-cli"')}${f('vendedor',n.vendedor,'text','list="l-ven"')}${f('local',n.local)}${f('peca',n.peca)}${f('fck',n.fck)}${f('slump',n.slump)}${f('m3',n.m3,'number')}${f('vm3',n.vm3,'number','step="any"')}${f('geo',n.geo||'','text','placeholder="lat, lon"')}${f('perc',n.perc,'number')}<td class="c"><input id="nf-bomba" type="checkbox" ${n.bomba?'checked':''}></td>${f('taxa',n.taxa,'number','step="any"')}<td></td><td class="c"><button onclick="addObra()">Lançar</button></td></tr></table>${dl(['l-cli','cliente'])}${dl(['l-ven','vendedor'])}
 <div style="margin:6px 0" id="st"></div>
 <div class="sec">MANHÃ — ${sum(m)} m³ · ${brl(m.reduce((a,o)=>a+tv(o),0))}</div><table>${th}${rowsObras(m)||''}</table>
 <div class="sec gap">TARDE — ${sum(t)} m³ · ${brl(t.reduce((a,o)=>a+tv(o),0))}</div><table>${th}${rowsObras(t)||''}</table>`}
function fila(tipo){
 const L=S.frota.filter(f=>f.tipo==tipo),rows=S.prod[UI.data+UI.usina]||[];
 return'<div class="fila">'+L.map((f,i)=>{const rs=rows.filter(r=>(tipo=='Bomba'?r.bomba:r.cam)==f.id),lv=rs.map(livreDe).filter(Boolean).sort().pop();
  return`<div class="chip" draggable="true" data-d="${f.id}" style="background:${f.cor};color:${tc(f.cor)}${f.manut?';opacity:.5;text-decoration:line-through':''}">${i+1}º ${e(f.cod)} ${e(f.mot.split('/')[0])} · ${f.manut?'MANUT.':f.entrada+(lv?' · livre '+lv:'')}</div>`}).join('')+'</div>'}
function gerar(auto){
 const k=UI.data+UI.usina,P=S.prod[k]=S.prod[k]||[],os=S.obras.filter(o=>o.data==UI.data&&o.usina==UI.usina);S.pa=S.pa||{};S.pa[k]=1;
 os.forEach(o=>{const n=Math.max(1,Math.ceil(o.m3/8)),ex=P.filter(r=>r.oid==o.id);
  ex.filter(r=>r.j===undefined).forEach((r,i)=>r.j=i);
  for(let j=0;j<n;j++){const v={prog:m2t(t2m(o.hora)+j*gap()),cli:o.cliente,loc:o.local,peca:o.peca,vend:o.vendedor,m3:j<n-1?8:(o.m3-8*(n-1)||8),fck:o.fck,slump:o.slump,perc:o.perc};
   let r=ex.find(x=>x.j===j);if(!r){r={id:uid(),oid:o.id,j,real:'',ped:'',cam:'',bomba:'',livre:'',obs:'',ed:{}};P.push(r)}
   r.ed=r.ed||{};for(const f in v)if(!r.ed[f])r[f]=v[f]}
  ex.filter(r=>r.j>=n&&!(r.cam||r.real||r.ped||r.bomba)).forEach(r=>P.splice(P.indexOf(r),1))});
 for(let i=P.length-1;i>=0;i--){const r=P[i];if(r.oid&&!S.obras.some(o=>o.id==r.oid)&&!(r.cam||r.real||r.ped||r.bomba))P.splice(i,1)}
 if(!(S.man&&S.man[k]))P.sort((a,b)=>t2m(a.prog)-t2m(b.prog));save();if(!auto)render()}
function agora(id){const r=find('prod',id);if(!r)return;const d=new Date();r.real=m2t(d.getHours()*60+d.getMinutes());r.ed=r.ed||{};r.ed.real=1;save();render()}
function autoLivre(id){const r=find('prod',id);if(!r)return;r.livre='';save();render()}
function painel(tipo){
 const L=ordem(tipo,UI.data),rows=S.prod[UI.data+UI.usina]||[],now=dstr(new Date())==UI.data?new Date().getHours()*60+new Date().getMinutes():-1,g={nu:[],li:[],oc:[],mn:[]};
 L.forEach((f,i)=>{const vi=vid(f,UI.data),rs=vi?rows.filter(r=>(tipo=='Bomba'?r.bomba:r.cam)==vi):[],lv=rs.map(livreDe).filter(Boolean).sort().pop(),o={f,n:i+1,lv};
  if(sit(f,UI.data))g.mn.push(o);else if(!rs.length)g.nu.push(o);else if(now>=0&&lv&&t2m(lv)<=now)g.li.push(o);else g.oc.push(o)});
 g.oc.sort((a,b)=>(a.lv||'').localeCompare(b.lv||''));
 const ch=(o,x)=>{const v=vv(o.f,UI.data),c=v.cor||'#D9D9D9';return`<div class="chip" draggable="true" data-d="${o.f.id}" style="background:${c};color:${tc(c)}">${o.n}º ${e(v.cod||'s/ veíc.')} · ${e(String(o.f.nome||'').split('/')[0])}${x}</div>`};
 const col=(t,c,l,x)=>`<div class="pc"><div class="ph" style="background:${c}">${t} (${l.length})</div>${l.map(o=>ch(o,x(o))).join('')||'<div class="leg">nenhum</div>'}</div>`;
 return`<div class="pn">${col('AINDA NÃO USADOS','#92D050',g.nu,o=>' · entra '+ent(o.f,UI.data))}${col('JÁ LIBERARAM','#FFFF00',g.li,o=>' · livre desde '+o.lv)}${col('OCUPADOS','#ED7D31',g.oc,o=>' · livre às '+(o.lv||'—'))}${col('AUSENTES / MANUT.','#FF0000',g.mn,o=>' · '+sit(o.f,UI.data))}</div>`}
function prod(){
 const k=UI.data+UI.usina,P=(S.prod[k]||[]),tot=P.reduce((a,r)=>a+(+r.m3||0),0),ac=S.acum[k]||0;
 const now=dstr(new Date())==UI.data?new Date().getHours()*60+new Date().getMinutes():-1;
 const sel=(r,f,tipo)=>{const cur=S.frota.find(x=>x.id==r[f]);return`<td><select data-k="prod" data-i="${r.id}" data-f="${f}" style="${cur?`background:${cur.cor};color:${tc(cur.cor)}`:''}"><option value=""></option>${S.frota.filter(x=>x.tipo==tipo).map(x=>`<option value="${x.id}" ${x.id==r[f]?'selected':''} style="background:${x.cor};color:${tc(x.cor)}">${e(x.cod)} ${e(x.placa)} · ${e(((drvOf(x.id,UI.data)||{}).nome||'sem motorista').split('/')[0])}${x.manut?' (manut.)':''}</option>`).join('')}</select></td>`};
 const rows=P.map(r=>{const cam=S.frota.find(x=>x.id==r.cam),lv=livreDe(r);let bg='';const dm=cam&&drvOf(cam.id,UI.data),pend=!dm;
  if(lv&&now>=0&&r.cam){const d=t2m(lv)-now;bg=d<0?'background:#FF0000;color:#fff':d<=15?'background:#FFFF00':''}
  return`<tr data-r="${r.id}" style="${pend?'background:#F4B183':''}"><td class="hd" draggable="true" style="cursor:grab;white-space:nowrap" title="Arraste para mover a linha">≡<button class="mb" onclick="mv('${r.id}',-1)">▲</button><button class="mb" onclick="mv('${r.id}',1)">▼</button></td><td>${inp('prod',r.id,'prog',r.prog,'time')}</td><td style="white-space:nowrap">${inp('prod',r.id,'real',r.real,'time')}<button class="mb" title="Pegar horário agora" onclick="agora('${r.id}')">⏱</button></td><td>${inp('prod',r.id,'ped',r.ped)}</td><td>${inp('prod',r.id,'cli',r.cli)}</td><td>${inp('prod',r.id,'loc',r.loc)}</td><td>${inp('prod',r.id,'peca',r.peca)}</td><td>${inp('prod',r.id,'vend',r.vend)}</td><td>${inp('prod',r.id,'m3',r.m3,'number')}</td><td>${inp('prod',r.id,'fck',r.fck)}</td><td>${inp('prod',r.id,'slump',r.slump)}</td><td>${inp('prod',r.id,'perc',r.perc,'number')}</td>${sel(r,'cam','Betoneira')}<td style="${cam?`background:${cam.cor};color:${tc(cam.cor)}`:''};white-space:nowrap;padding:4px">${dm?e(dm.nome)+(sit(dm,UI.data)?' ⚠ '+sit(dm,UI.data):''):'⚠ PENDENTE'}</td>${sel(r,'bomba','Bomba')}<td style="${bg};white-space:nowrap">${inp('prod',r.id,'livre',r.livre||lv,'time','style="font-weight:700"')}${r.livre?`<button class="mb" title="Voltar ao cálculo automático" onclick="autoLivre('${r.id}')">↺</button>`:''}</td><td>${inp('prod',r.id,'obs',r.obs)}</td><td class="x" onclick="del('prod','${r.id}')">×</td></tr>`}).join('');
 return`<div class="tot"><div class="o">TOTAL ${tot.toFixed(1)} m³</div><div class="y">${P.length} cargas</div><div style="background:#92D050">PRODUZIDO ${P.filter(r=>r.real).reduce((a,r)=>a+(+r.m3||0),0).toFixed(1)} m³</div></div><div style="margin-bottom:6px"><button onclick="exportProd()">📊 Baixar produção do dia (Excel)</button> <span class="hint">Conta como produzida a carga com horário em “Realizado” (use o ⏱).</span></div>
 ${proxima()}
 <div class="sec" style="margin-top:0">CAMINHÕES E BOMBAS — arraste um cartão para mudar a ordem de carregamento</div>
 <b style="font-size:11px">BETONEIRAS</b>${painel('Betoneira')}<b style="font-size:11px">BOMBAS</b>${painel('Bomba')}
 <div class="sec">USINA DE PLANALTINA ${UI.usina} <span style="background:#F4B183;padding:0 8px;border:1px solid #333">linha laranja = sem motorista (pendente)</span></div>
 <table><tr><th></th><th>Prog.</th><th>Realizado</th><th>Nº Pedido</th><th>Cliente</th><th>Local concretagem</th><th>Peça</th><th>Vendedor</th><th>M³</th><th>FCK</th><th>Slump</th><th>Perc.</th><th>Betoneira</th><th>Motorista</th><th>Bomba</th><th>Livre às</th><th>Balança</th><th></th></tr>${rows}</table>
 <div style="margin-top:8px"><button onclick="gerar()">↻ Atualizar da programação</button> <span class="hint">As cargas e horários já vêm da programação. O botão atualiza só o que você não editou à mão.</span> <button onclick="novaLinha()">+ Linha</button> <button onclick="(S.man=S.man||{})[UI.data+UI.usina]=0;gerar()">Ordenar por horário</button> <span class="hint">“Livre às” = horário + 40 min carregando + 1h descarregando (ajuste em Equipe e frota > Capacidade). Edite se mudar. Fica amarelo 15 min antes e vermelho se já liberou.</span></div>`}
function eq(){
 const D=UI.data,SIT=['Férias','Banco de hora','Atestado','Falta','Folga'],vs=t=>S.frota.filter(f=>f.tipo==t);
 const dia=tipo=>{const O=ordem(tipo,D),P=O.filter(x=>!sit(x,D));return`<table><tr><th>Ordem</th><th>${tipo=='Bomba'?'Motorista bomba / ajudante':'Motorista'}</th><th>Veículo</th><th>Entrada</th><th>Situação</th></tr>`+O.map(f=>{const a=sit(f,D),o=(S.ov[D]||{})[f.id]||{},cv=vid(f,D);return`<tr style="background:${a?'#FF9999':'inherit'}"><td class="c">${a?'—':P.indexOf(f)+1}</td><td style="padding:4px">${e(f.nome)||'<i>sem nome</i>'}</td><td><select onchange="setV('${f.id}',this.value)" style="width:100%;font-weight:700"><option value="">— sem veículo —</option>${vs(tipo).map(x=>`<option value="${x.id}" ${x.id==cv?'selected':''}>${e(x.cod)} · ${e(x.placa)}${x.manut?' (manut.)':''}</option>`).join('')}</select></td><td>${a?'':`<input data-t="1" data-ov="ent" data-i="${f.id}" maxlength="5" inputmode="numeric" value="${e(ent(f,D))}" style="width:62px;text-align:center${o.ent?';background:#FFFF00;font-weight:700':''}">`}</td><td><select data-ov="aus" data-i="${f.id}"><option value="">${a&&!o.aus?e(a)+' (automático)':'Automático'}</option><option value="P" ${o.aus=='P'?'selected':''}>Presente</option>${SIT.map(x=>`<option ${o.aus==x?'selected':''}>${x}</option>`).join('')}</select></td></tr>`}).join('')+'</table>'};
 const cadM=tipo=>`<table><tr><th></th><th>Base</th><th>Motorista</th><th>Ausência</th><th>De</th><th>Até</th><th></th></tr>`+S.mots.filter(f=>f.tipo==tipo).map((f,i)=>`<tr draggable="true" data-d="${f.id}"><td class="c" style="cursor:grab">≡</td><td class="c">${i+1}</td><td>${inp('mots',f.id,'nome',f.nome)}</td><td><select data-k="mots" data-i="${f.id}" data-f="au_t"><option value=""></option>${SIT.map(x=>`<option ${f.au_t==x?'selected':''}>${x}</option>`).join('')}</select></td><td>${inp('mots',f.id,'au_de',f.au_de||'','date')}</td><td>${inp('mots',f.id,'au_ate',f.au_ate||'','date')}</td><td class="x" onclick="del('mots','${f.id}')">×</td></tr>`).join('')+`</table><button onclick="addMot('${tipo}')">+ Motorista</button>`;
 const cadV=tipo=>`<table><tr><th>Cód.</th><th>Placa</th><th>Cor</th><th>Manutenção</th><th></th></tr>`+vs(tipo).map(f=>`<tr style="background:${f.manut?'#FF9999':'inherit'}"><td>${inp('frota',f.id,'cod',f.cod)}</td><td>${inp('frota',f.id,'placa',f.placa)}</td><td class="c"><input type="color" data-k="frota" data-i="${f.id}" data-f="cor" value="${f.cor}" style="width:40px;padding:0"></td><td class="c"><input type="checkbox" data-k="frota" data-i="${f.id}" data-f="manut" ${f.manut?'checked':''}></td><td class="x" onclick="del('frota','${f.id}')">×</td></tr>`).join('')+`</table><button onclick="addVeic('${tipo}')">+ Veículo</button>`;
 const dt=(n,t,b)=>`<details ${UI.op[n]?'open':''} ontoggle="UI.op.${n}=this.open"><summary class="sec" style="cursor:pointer">${t}</summary>${b}</details>`;
 const sl=t=>(S.rod.slots[t]||[]).join(', '),br=D.split('-').reverse().join('/');
 return`<div style="margin-bottom:6px"><button onclick="exportXlsx()">📊 Baixar escala em Excel</button> <button onclick="delete S.ov[UI.data];save();render()">Desfazer ajustes do dia</button> <span class="hint">Dia ${br} (muda com a data do topo). Troque o <b>Veículo</b> do motorista aqui: vale deste dia em diante; se o veículo estava com outro motorista, os dois trocam.</span></div>
 <div class="sec" style="margin-top:0">BOMBAS</div>${dia('Bomba')}
 <div class="sec">BETONEIRAS</div>${dia('Betoneira')}
 ${dt('rod','RODÍZIO — sentido, horários e dias de trabalho (clique para abrir)',`<table style="width:auto"><tr><th>Sentido</th><th>Horários de entrada — Bombas</th><th>Horários de entrada — Betoneiras</th></tr><tr><td><select data-cfg="sent"><option value="1" ${S.cfg.sent>0?'selected':''}>1º de hoje vira 2º amanhã (o último sobe p/ 1º)</option><option value="-1" ${S.cfg.sent<0?'selected':''}>1º de hoje vai para o fim amanhã</option></select></td><td><input data-slot="Bomba" value="${e(sl('Bomba'))}" style="min-width:200px"></td><td><input data-slot="Betoneira" value="${e(sl('Betoneira'))}" style="min-width:260px"></td></tr></table><div style="margin:4px 0">Dias de trabalho: ${[1,2,3,4,5,6,0].map(n=>`<label style="margin-right:8px"><input type="checkbox" data-dia="${n}" ${S.cfg.dias.includes(n)?'checked':''}> ${DIAS[n]}</label>`).join('')}</div><div class="hint" style="margin:4px 0">A ordem do cadastro vale em ${S.rod.base.split('-').reverse().join('/')} e gira uma posição por dia de trabalho; os horários acompanham a posição. Quem está ausente sai da fila e os demais sobem.</div><button onclick="fixarBase()">Usar a escala de ${br} como nova base</button>`)}
 ${dt('cadm','MOTORISTAS — ordem base e ausências (clique para abrir)','<b>Bombas</b> (arraste ≡ para mudar a ordem base)'+cadM('Bomba')+'<b>Betoneiras</b>'+cadM('Betoneira'))}
 ${dt('cadv','VEÍCULOS — placa, código e manutenção (clique para abrir)','<b>Bombas</b>'+cadV('Bomba')+'<b>Betoneiras</b>'+cadV('Betoneira'))}
 ${dt('out','PAZEIRO / PROGRAMAÇÃO / FÉRIAS / BANCO DE HORA (clique para abrir)',`<table><tr><th>Função</th><th>Nome</th><th>Horário</th><th></th></tr>${S.staff.map(s=>`<tr><td>${inp('staff',s.id,'cat',s.cat)}</td><td>${inp('staff',s.id,'nome',s.nome)}</td><td>${inp('staff',s.id,'hora',s.hora,'time')}</td><td class="x" onclick="del('staff','${s.id}')">×</td></tr>`).join('')}</table><button onclick="S.staff.push({id:uid(),cat:'',nome:'',hora:''});save();render()">+ Pessoa</button> <span class="hint">Nome em “Férias” ou “Banco de hora” igual ao de um motorista = ausente automático.</span>`)}
 ${dt('cap','CAPACIDADE E BACKUP (clique para abrir)',`<table style="width:auto"><tr><th>m³/h da central</th><th>Ida fixa (min)</th><th>Descarga (min)</th><th>Carregar (min) — livre às</th><th>Descarregar (min) — livre às</th></tr><tr><td><input type="number" data-cfg="mh" value="${S.cfg.mh}"></td><td><input type="number" data-cfg="ida" value="${S.cfg.ida}"></td><td><input type="number" data-cfg="desc" value="${S.cfg.desc}"></td><td><input type="number" data-cfg="lc" value="${S.cfg.lc}"></td><td><input type="number" data-cfg="ld" value="${S.cfg.ld}"></td></tr></table><table style="width:auto"><tr><th>Usina DF — coordenada</th><th>Usina GO — coordenada</th><th>Vazão da bomba (m³/h)</th><th>Montar (min)</th><th>Lavar (min)</th><th>Velocidade média (km/h)</th></tr><tr><td><input data-coord="DF" value="${e(S.cfg.coord.DF)}" style="min-width:190px"></td><td><input data-coord="GO" value="${e(S.cfg.coord.GO)}" style="min-width:190px" placeholder="vazio = usa a do DF"></td><td><input type="number" data-cfg="bv" value="${S.cfg.bv}"></td><td><input type="number" data-cfg="bm" value="${S.cfg.bm}"></td><td><input type="number" data-cfg="bl" value="${S.cfg.bl}"></td><td><input type="number" data-cfg="vel" value="${S.cfg.vel}"></td></tr></table><div class="hint" style="margin:4px 0">Percurso das obras com coordenada = distância em linha reta × 1,35 ÷ velocidade média. A coordenada do DF é aproximada: troque pela exata do portão da usina.</div><div class="hint" style="margin:4px 0">Intervalo entre cargas: ${gap()} min (8 m³ ÷ m³/h). Ciclo (cabe/apertado) = ida fixa + descarga + 2 × percurso.</div><button onclick="backup()">Baixar backup</button> <label class="hint"><button onclick="this.nextElementSibling.click()">Restaurar backup</button><input type="file" accept=".json" hidden onchange="restaurar(this.files[0])"></label>`)}`}
function render(){if(UI.tab=='prod'&&!(S.pa&&S.pa[UI.data+UI.usina])&&!(S.prod[UI.data+UI.usina]||[]).length&&S.obras.some(o=>o.data==UI.data&&o.usina==UI.usina))gerar(true);head();$('#app').innerHTML=UI.tab=='prog'?prog():UI.tab=='prod'?prod():eq();if(UI.tab=='prog')aviso()}
render();
</script></body></html>
