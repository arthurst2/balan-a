<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">

<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#E7E6E6;color:#000;font:13px Arial,Helvetica,sans-serif}
.ban{background:#FFFF00;text-align:center;font-weight:700;font-size:15px;padding:5px;border-bottom:1px solid #999}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--az);color:#fff;padding:6px 8px;font-weight:700}
.bar button,.bar input{font:inherit}
button{cursor:pointer;border:1px solid #666;background:#f2f2f2;padding:4px 10px;font-weight:700}
button.on{background:#FFFF00}
.tab.on{background:#FFFF00}
.pad{padding:8px;overflow-x:auto}
.sec{background:var(--vd);color:#000;font-weight:700;text-align:center;padding:3px;border:1px solid #333;margin-top:10px}
.sec.gap{margin-top:22px}
table{border-collapse:collapse;width:100%;background:var(--cz)}
th{background:var(--az);color:#fff;border:1px solid #333;padding:4px;font-size:12px;white-space:nowrap}
td{border:1px solid #888;padding:0}
td input,td select{width:100%;border:0;background:transparent;font:inherit;padding:4px;min-width:44px}
td input[type=checkbox]{width:auto}
td.c{text-align:center;padding:3px}
tr.nf td{background:#FFF2CC}
.sem{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.dia{flex:1;min-width:84px;border:1px solid #333;text-align:center;padding:4px;cursor:pointer;background:var(--cz)}
.dia.on{outline:3px solid #000}
.dia.g{border-bottom:6px solid #00B050}.dia.y{border-bottom:6px solid #FFC000}.dia.r{border-bottom:6px solid #FF0000}
.tl{display:flex;gap:2px;margin-bottom:4px}
.sl{flex:1;min-width:26px;text-align:center;border:1px solid #333;padding:2px 0;font-size:12px}
.sl b{display:block;height:14px;font-size:10px}.sl span{font-weight:700;font-size:15px;display:block}.sl small{font-size:10px}
.sl.g{background:#92D050}.sl.y{background:#FFC000}.sl.r{background:#FF0000;color:#fff}
.gap{flex:0 0 18px;background:transparent}
i.gap{border:0}
.badge{display:inline-block;padding:3px 10px;font-weight:700;border:1px solid #333}
.badge.cabe{background:#92D050}.badge.apertado{background:#FFC000}.badge.cheio{background:#FF0000;color:#fff}

.tot .o{background:#ED7D31}.tot .y{background:#FFFF00}
.tot input{width:90px;font:inherit;font-weight:700}
.fila{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.chip{border:1px solid #000;padding:3px 8px;font-weight:700;cursor:grab;user-select:none}
.leg{font-size:11px;color:#333;margin:2px 0 6px}
.x{color:#a00;font-weight:700;cursor:pointer;text-align:center;padding:0 6px}
.hint{font-size:11px;margin-left:6px}
td input[data-t]{width:62px;min-width:62px;text-align:center}
.pn{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px;margin-bottom:8px}
.pc{border:1px solid #333;background:#F2F2F2;padding:4px;min-width:0}
.ph{font-weight:700;padding:3px;text-align:center;margin-bottom:4px;border:1px solid #333}
.pc .chip{display:block;margin-bottom:3px}
.mb{padding:0 5px;margin:0 2px;font-size:13px;line-height:22px}
</style></head><body>
<div class="ban" id="ban"></div>

<div class="pad" id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
const $=s=>document.querySelector(s),K='usina_v1';
const pad=n=>String(n).padStart(2,'0');
const m2t=m=>pad(Math.floor(m/60)%24)+':'+pad(((m%60)+60)%60);
const t2m=t=>{const[a,b]=(t||'0:0').split(':');return(+a||0)*60+(+b||0)};
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[y,m,d]=s.split('-');return new Date(+y,m-1,+d)};
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const COR=['#FF0000','#00B0F0','#7030A0','#92D050','#ED7D31','#FFC000','#0070C0','#FF66CC','#00B050','#A5A5A5','#C55A11','#2F5597'];
const tc=c=>{const n=parseInt(c.slice(1),16),l=.299*(n>>16)+.587*(n>>8&255)+.114*(n&255);return l>150?'#000':'#fff'};
const DIAS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function defaults(){
 const B=[['Manoel /Thiago','EOF-6045','10:00','BE10','Bomba',0],['João Pedro /Marcos/João','OOZ-1C55','06:00','BE05','Bomba',0],['Sandro/François','HEM-8064','06:20','BE03','Bomba',0],
 ['Silvano','OMX-5E46','06:00','99','Betoneira',0],['Raffael','FRU 6C05','06:20','107','Betoneira',0],['Ivonildes','QIF 0259','06:20','105','Betoneira',0],['Rosenvaldo','FRU 5C48','06:40','108','Betoneira',0],['Guilherme','TMG8E42','07:00','6','Betoneira',0],['Gilvane','FIP9721','07:00','97','Betoneira',0],['Claudemir','QDS9D70','07:20','104','Betoneira',0],['Gabriel','OXI7E37','11:00','106','Betoneira',1],['','FEJ 8J52','07:00','100','Betoneira',1]];
 return{cfg:{mh:24,ida:60,desc:60},
 frota:B.map((b,i)=>({id:uid(),mot:b[0],placa:b[1],entrada:b[2],cod:b[3],tipo:b[4],manut:!!b[5],cor:COR[i]})),
 staff:[{id:uid(),cat:'Pazeiro',nome:'Pedro',hora:'06:00'},{id:uid(),cat:'Programação/Balança',nome:'Carlos Henrique',hora:'06:00'},{id:uid(),cat:'Férias',nome:'Adelvice',hora:''},{id:uid(),cat:'Banco de hora',nome:'Milton',hora:''}],
 obras:[],prod:{},acum:{}}}
let S;
try{S=JSON.parse(localStorage.getItem(K))}catch(_){}
if(!S||!S.frota)S=defaults();
function mig(){S.ui=S.ui||{};S.ov=S.ov||{};S.man=S.man||{};S.cfg.dias=S.cfg.dias||[1,2,3,4,5,6];if(S.cfg.sent===undefined)S.cfg.sent=1;if(!S.rod){S.rod={base:dstr(new Date()),slots:{}};['Bomba','Betoneira'].forEach(t=>S.rod.slots[t]=S.frota.filter(f=>f.tipo==t&&!f.manut).map(f=>f.entrada))}}mig();
let UI={tab:'prog',usina:'DF',data:dstr(new Date()),nf:{hora:'08:00',cliente:'',vendedor:'',local:'',peca:'',fck:25,slump:'12±2',m3:16,perc:20,bomba:false}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(_){}};
const gap=()=>Math.max(5,Math.round(8/S.cfg.mh*60));
const cic=o=>S.cfg.ida+S.cfg.desc+2*(+o.perc||0);
const cargas=o=>{const n=Math.max(1,Math.ceil((+o.m3||8)/8)),g=gap();return Array.from({length:n},(_,k)=>{const s=t2m(o.hora)+k*g;return[s,s+cic(o)]})};
const disp=(tipo,s,data)=>S.frota.filter(f=>f.tipo==tipo&&!sit(f,data)&&t2m(ent(f,data))<=s).length;
function uso(data,us,extra){
 const os=S.obras.filter(o=>o.data==data&&o.usina==us);if(extra)os.push(extra);
 const bt=Array(24).fill(0),bb=Array(24).fill(0);
 os.forEach(o=>{const cs=cargas(o);
  cs.forEach(([a,b])=>{for(let i=0;i<24;i++){const s=360+i*30;if(a<=s&&b>s)bt[i]++}});
  if(o.bomba){const x=S.cfg.ida+(+o.perc||0),a=cs[0][0]+x,b=cs[cs.length-1][0]+x+S.cfg.desc;for(let i=0;i<24;i++){const s=360+i*30;if(a<=s&&b>s)bb[i]++}}});
 return{bt,bb}}
function status(data,us,o){
 const u=uso(data,us,o),cs=cargas(o),a=cs[0][0],b=cs[cs.length-1][1];let r='cabe';
 for(let i=0;i<24;i++){const s=360+i*30;if(s+30<=a||s>=b)continue;
  const l=disp('Betoneira',s,data)-u.bt[i];if(l<0)return'cheio';if(l==0)r='apertado';
  if(o.bomba){const lb=disp('Bomba',s,data)-u.bb[i];if(lb<0)return'cheio';if(lb==0)r='apertado'}}
 return r}
function sugere(data,us,o){const t=t2m(o.hora);for(let d=15;d<=720;d+=15)for(const x of[t+d,t-d]){if(x<360||x>1020)continue;if(status(data,us,{...o,hora:m2t(x)})=='cabe')return m2t(x)}return null}
function readNF(){const g=i=>document.getElementById('nf-'+i);return{hora:nt(g('hora').value)||'08:00',cliente:g('cliente').value,vendedor:g('vendedor').value,local:g('local').value,peca:g('peca').value,fck:g('fck').value,slump:g('slump').value,m3:+g('m3').value||0,perc:+g('perc').value||0,bomba:g('bomba').checked}}
function aviso(){
 const el=$('#st');if(!el)return;const o=readNF();UI.nf=o;
 if(!o.m3){el.innerHTML='';return}
 const s=status(UI.data,UI.usina,o);let h=`<span class="badge ${s}">${s=='cabe'?'Cabe':s=='apertado'?'Apertado':'Cheio'}</span>`;
 if(s!='cabe'){const g=sugere(UI.data,UI.usina,o);h+=g?` <span class="hint">Horário livre mais próximo: <b>${g}</b> <button onclick="usaH('${g}')">Usar</button></span>`:' <span class="hint">Sem horário livre neste dia.</span>'}
 const p=o.perc<=20?'Perto':o.perc<=40?'Médio':'Longe';
 el.innerHTML=h+` <span class="hint">${p} da usina · ciclo ${Math.floor(cic(o)/60)}h${pad(cic(o)%60)}</span>`}
const usaH=h=>{$('#nf-hora').value=h;aviso()};
function addObra(){const o=readNF();if(!o.cliente&&!o.m3)return;S.obras.push({...o,id:uid(),data:UI.data,usina:UI.usina});
 UI.nf={...o,cliente:'',local:''};save();render()}
const livreDe=r=>r.livre||((r.real||r.prog)?m2t(t2m(r.real||r.prog)+S.cfg.ida+S.cfg.desc+2*(+r.perc||0)):'');
function gerarOld(){const k=UI.data+UI.usina,P=S.prod[k]=S.prod[k]||[];
 S.obras.filter(o=>o.data==UI.data&&o.usina==UI.usina).forEach(o=>{if(P.some(r=>r.oid==o.id))return;
  const n=Math.max(1,Math.ceil(o.m3/8));
  for(let j=0;j<n;j++)P.push({id:uid(),oid:o.id,prog:m2t(t2m(o.hora)+j*gap()),real:'',ped:'',cli:o.cliente,loc:o.local,peca:o.peca,vend:o.vendedor,m3:j<n-1?8:(o.m3-8*(n-1)||8),fck:o.fck,slump:o.slump,perc:o.perc,cam:'',bomba:'',livre:'',obs:''})});
 P.sort((a,b)=>t2m(a.prog)-t2m(b.prog));save();render()}
const novaLinha=()=>{const k=UI.data+UI.usina;(S.prod[k]=S.prod[k]||[]).push({id:uid(),prog:'',real:'',ped:'',cli:'',loc:'',peca:'',vend:'',m3:8,fck:'',slump:'',perc:20,cam:'',bomba:'',livre:'',obs:''});save();render()};
function del(k,id){if(k=='obras')S.obras=S.obras.filter(o=>o.id!=id);else if(k=='prod'){const a=S.prod[UI.data+UI.usina];S.prod[UI.data+UI.usina]=a.filter(r=>r.id!=id)}else S[k]=S[k].filter(o=>o.id!=id);save();render()}
function find(k,id){return k=='prod'?(S.prod[UI.data+UI.usina]||[]).find(r=>r.id==id):S[k].find(o=>o.id==id)}
document.addEventListener('change',ev=>{const t=ev.target,k=t.dataset.k;if(t.dataset.t)t.value=nt(t.value);if(t.id&&t.id.startsWith('nf-')){aviso();return}
 if(t.dataset.ov){ovSet(t.dataset.i,t.dataset.ov,t.value);return}if(t.dataset.slot){S.rod.slots[t.dataset.slot]=t.value.split(/[ ,;]+/).map(nt).filter(Boolean);save();render();return}if(t.dataset.dia!==undefined){const d=+t.dataset.dia,a=S.cfg.dias;S.cfg.dias=t.checked?[...new Set([...a,d])]:a.filter(x=>x!=d);save();render();return}if(t.dataset.cfg){S.cfg[t.dataset.cfg]=+t.value||0;save();render();return}
 if(t.id=='acum'){S.acum[UI.data+UI.usina]=+t.value||0;save();render();return}
 if(!k)return;const it=find(k,t.dataset.i);if(!it)return;
 it[t.dataset.f]=t.type=='checkbox'?t.checked:t.type=='number'?+t.value:t.value;if(k=='prod'){it.ed=it.ed||{};it.ed[t.dataset.f]=1}save();setTimeout(rr,0)});
document.addEventListener('input',ev=>{if(ev.target.id&&ev.target.id.startsWith('nf-'))aviso()});
let dg=null;
document.addEventListener('dragstart',ev=>{const t=ev.target.closest('[data-d]');if(t)dg=t.dataset.d});
document.addEventListener('dragover',ev=>{if(ev.target.closest('[data-d]'))ev.preventDefault()});
document.addEventListener('drop',ev=>{const t=ev.target.closest('[data-d]');if(!t||!dg||dg==t.dataset.d)return;ev.preventDefault();
 const ia=S.frota.findIndex(f=>f.id==dg),ib=S.frota.findIndex(f=>f.id==t.dataset.d);
 if(S.frota[ia].tipo!=S.frota[ib].tipo)return;const[x]=S.frota.splice(ia,1);S.frota.splice(ib,0,x);dg=null;save();render()});
let dr=null;
document.addEventListener('dragstart',ev=>{const t=ev.target.closest&&ev.target.closest('tr[data-r]');dr=t&&ev.target.classList.contains('hd')?t.dataset.r:null;if(dr&&ev.dataTransfer){ev.dataTransfer.setData('text','x');ev.dataTransfer.setDragImage(t,0,0)}});
document.addEventListener('dragover',ev=>{if(dr&&ev.target.closest('tr[data-r]'))ev.preventDefault()});
document.addEventListener('drop',ev=>{const t=ev.target.closest('tr[data-r]');if(!dr||!t)return;ev.preventDefault();movTo(dr,t.dataset.r);dr=null});
function movTo(a,b){const k=UI.data+UI.usina,P=S.prod[k]||[],ia=P.findIndex(r=>r.id==a),ib=P.findIndex(r=>r.id==b);if(ia<0||ib<0||ia==ib)return;const[x]=P.splice(ia,1);P.splice(ib,0,x);(S.man=S.man||{})[k]=1;save();rr()}
function mv(id,d){const P=S.prod[UI.data+UI.usina]||[],i=P.findIndex(r=>r.id==id),j=i+d;if(i<0||j<0||j>=P.length)return;movTo(id,P[j].id)}
function ovSet(id,f,v){const o=S.ov[UI.data]=S.ov[UI.data]||{},x=o[id]=o[id]||{};if(v)x[f]=v;else delete x[f];save();render()}
async function exportXlsx(){
 const dl=window.claude?await claude.use('downloads'):null;
 
 if(!window.ExcelJS){alert('A biblioteca do Excel não carregou. Recarregue a página.');return}
 const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Escala',{views:[{showGridLines:false}]}),bd={style:'thin',color:{argb:'FF808080'}},BR={top:bd,left:bd,bottom:bd,right:bd};
 ws.columns=[34,16,10,12,11,42].map(w=>({width:w}));
 const put=(r,c,v,o={})=>{const x=ws.getCell(r,c);x.value=v;x.font={name:'Arial',size:10,bold:true,color:{argb:o.fc||'FF000000'}};x.alignment={horizontal:'center',vertical:'middle'};x.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF'+(o.bg||'D9D9D9')}};x.border=BR};
 put(1,1,'“VOCÊ É O MOTORISTA DA SUA PRÓPRIA VIDA, PORTANTO TRATE DE DIRIGIR BEM”',{bg:'FFFF00'});for(let c=2;c<=6;c++)put(1,c,'',{bg:'FFFF00'});ws.mergeCells('A1:F1');ws.getRow(1).height=20;
 let r=2;const W='FFFFFFFF';
 const hdr=a=>{for(let c=1;c<=6;c++)put(r,c,a[c-1]||'',{bg:'4472C4',fc:W});r++};
 const grupo=(tipo,cab)=>{hdr(cab);let n=0;ordem(tipo,UI.data).forEach(f=>{const a=sit(f,UI.data);if(!a)n++;[(f.mot||'').toUpperCase(),(f.placa||'').toUpperCase(),a?'':ent(f,UI.data),a?a.toUpperCase():n,f.cod,''].forEach((x,i)=>put(r,i+1,x,i==3&&a?{bg:'FF0000'}:{}));ws.getRow(r).height=tipo=='Bomba'?24:16;r++})};
 grupo('Bomba',['MOTORISTA BOMBA / AJUDANTE','PLACA','HORARIO','Nº','COD. BE.','OBSERVAÇÃO']);
 for(let c=1;c<=6;c++)put(r,c,'');r++;
 grupo('Betoneira',['MOTORISTA BETONEIRA','PLACA','','','COD. BT.','']);
 [...new Set(S.staff.map(s=>s.cat))].forEach(cat=>{
  const L=S.staff.filter(s=>s.cat==cat),banco=/banco/i.test(cat),th=L.some(s=>s.hora);
  for(let c=1;c<=6;c++){const az=c==1||c==2||(c==4&&th);put(r,c,c==1?cat.toUpperCase():c==2&&banco?'BANCO DE HORA':c==4&&th?'HORARIO':'',{bg:az?'4472C4':'D9D9D9',fc:W})}r++;
  L.forEach(s=>{for(let c=1;c<=6;c++)put(r,c,c==1?(s.nome||'').toUpperCase():c==4?s.hora:'',{bg:banco&&c==2?'FFFF00':'D9D9D9'});if(!banco)ws.mergeCells(r,1,r,3);r++});
  if(banco){for(let c=1;c<=6;c++)put(r,c,'',{bg:c<=2?'FFFF00':'D9D9D9'});r++}});
 const buf=await wb.xlsx.writeBuffer();
 const nome='escala-'+UI.data+'.xlsx';if(dl){try{await dl.save({filename:nome,data:buf})}catch(err){if(err&&err.code!='declined')alert('Não foi possível salvar: '+(err.message||err.code))}return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download=nome;a.click()}
const norm=x=>String(x||'').trim().toLowerCase();
function sit(f,data){
 if(f.manut)return'Manutenção';
 const o=S.ov[data]&&S.ov[data][f.id];if(o&&o.aus)return o.aus=='P'?'':o.aus;
 if(f.au_t&&f.au_de&&data>=f.au_de&&data<=(f.au_ate||f.au_de))return f.au_t;
 const ns=String(f.mot||'').split('/').map(norm).filter(Boolean),x=S.staff.find(z=>/f[eé]rias|banco/i.test(z.cat)&&ns.includes(norm(z.nome)));
 return x?x.cat:''}
function nrod(x){const b=S.rod.base;if(x==b)return 0;const[a,z,sg]=x>b?[b,x,1]:[x,b,-1],d=pd(a),f=pd(z);let n=0;while(d<f){d.setDate(d.getDate()+1);if(S.cfg.dias.includes(d.getDay()))n++}return sg*n}
function ordem(tipo,data){
 const R=S.frota.filter(f=>f.tipo==tipo),N=R.length;if(!N)return[];
 const k=(((nrod(data)*(+S.cfg.sent||1))%N)+N)%N,L=R.map((_,i)=>R[(((i-k)%N)+N)%N]);
 return[...L.filter(f=>!sit(f,data)),...L.filter(f=>sit(f,data))]}
function ent(f,data){
 const o=S.ov[data]&&S.ov[data][f.id];if(o&&o.ent)return o.ent;
 const i=ordem(f.tipo,data).filter(x=>!sit(x,data)).indexOf(f),sl=S.rod.slots[f.tipo]||[];
 return i<0?'':(sl[Math.min(i,sl.length-1)]||f.entrada||'')}
function fixarBase(){['Bomba','Betoneira'].forEach(t=>{const o=ordem(t,UI.data);S.frota=[...S.frota.filter(f=>f.tipo!=t),...o]});S.rod.base=UI.data;save();render()}
function addVeic(tipo){S.frota.push({id:uid(),mot:'',placa:'',entrada:'06:00',cod:'',tipo,manut:false,cor:COR[S.frota.length%12]});save();render()}
async function backup(){const dl=window.claude?await claude.use('downloads'):null;if(dl){try{await dl.save({filename:'usina-backup-'+dstr(new Date())+'.json',data:JSON.stringify(S)})}catch(_){}return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='usina-backup-'+dstr(new Date())+'.json';a.click()}
function restaurar(f){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.frota){S=d;mig();save();render()}}catch(_){alert('Arquivo inválido')}};r.readAsText(f)}
const setD=d=>{UI.data=d;render()};
const shift=n=>{const d=pd(UI.data);d.setDate(d.getDate()+n);setD(dstr(d))};
const nt=v=>{const d=String(v||'').replace(/\D/g,'');if(!d)return'';let h,m;if(d.length<=2){h=+d;m=0}else{m=+d.slice(-2);h=+d.slice(0,-2)}return(h>23||m>59)?v:pad(h)+':'+pad(m)};
const inp=(k,i,f,v,t='text',x='')=>`<input type="${t=='time'?'text':t}" ${t=='time'?'data-t="1" inputmode="numeric" maxlength="5" placeholder="hh:mm"':''} data-k="${k}" data-i="${i}" data-f="${f}" value="${e(v)}" ${x}>`;
function keyOf(el){if(!el||el==document.body)return null;if(el.id)return'#'+el.id;const d=el.dataset;return d&&d.k?`[data-k="${d.k}"][data-i="${d.i}"][data-f="${d.f}"]`:null}
function rr(){const p=$('#app'),sl=p.scrollLeft,sy=scrollY,k=keyOf(document.activeElement);render();$('#app').scrollLeft=sl;scrollTo(0,sy);if(k){const n=document.querySelector(k);if(n){n.focus();if(n.select&&n.type!='checkbox')try{n.select()}catch(_){}}}}
function head(){
 const d=pd(UI.data);
 $('#ban').textContent=`USINA DE PLANALTINA ${UI.usina} — ${DIAS[d.getDay()]}, ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
 $('#bar').innerHTML=['prog:Programação','prod:Produção do dia','eq:Equipe e frota'].map(x=>{const[a,b]=x.split(':');return`<button class="tab ${UI.tab==a?'on':''}" onclick="UI.tab='${a}';render()">${b}</button>`}).join('')+
 `<span style="margin-left:12px">Usina:</span><button class="${UI.usina=='DF'?'on':''}" onclick="UI.usina='DF';render()">DF</button><button class="${UI.usina=='GO'?'on':''}" onclick="UI.usina='GO';render()">GO</button>`+
 `<span style="margin-left:12px"></span><button onclick="shift(-1)">◀</button><input type="date" value="${UI.data}" onchange="setD(this.value)"><button onclick="shift(1)">▶</button><button onclick="setD(dstr(new Date()))">Hoje</button>`}
function semana(){
 const d=pd(UI.data),dow=d.getDay()||7;d.setDate(d.getDate()-dow+1);let h='<div class="sem">';
 for(let i=0;i<7;i++){const s=dstr(d),os=S.obras.filter(o=>o.data==s&&o.usina==UI.usina),m3=os.reduce((a,o)=>a+(+o.m3||0),0),u=uso(s,UI.usina);
  let c='g';for(let j=0;j<24;j++){const sl=360+j*30,l=disp('Betoneira',sl,s)-u.bt[j],lb=disp('Bomba',sl,s)-u.bb[j];if(l<0||lb<0){c='r';break}if((l==0||lb==0)&&c=='g')c='y'}
  h+=`<div class="dia ${c} ${s==UI.data?'on':''}" onclick="setD('${s}')"><b>${DIAS[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}</b><br>${m3} m³ · ${os.length} obra${os.length==1?'':'s'}</div>`;d.setDate(d.getDate()+1)}
 return h+'</div>'}
function timeline(){
 const u=uso(UI.data,UI.usina);let h='<div class="tl">';
 for(let i=0;i<24;i++){const s=360+i*30,l=disp('Betoneira',s,UI.data)-u.bt[i],lb=disp('Bomba',s,UI.data)-u.bb[i],c=(l<0||lb<0)?'r':(l==0||lb==0)?'y':'g';
  if(i==12)h+='<i class="gap"></i>';
  h+=`<div class="sl ${c}" title="${m2t(s)}"><b>${i%2?'':pad(s/60)+'h'}</b><span>${Math.max(l,0)}</span><small>🚛${l<0?l:''} B${Math.max(lb,0)}</small></div>`}
 return h+'</div><div class="leg">Número grande: betoneiras livres na meia hora. B: bombas livres. Vermelho: não cabe mais carga. Amarelo: última vaga. Verde: sobra pelo menos uma.</div>'}
function rowsObras(list){
 return list.map(o=>`<tr><td>${inp('obras',o.id,'hora',o.hora,'time')}</td><td>${inp('obras',o.id,'cliente',o.cliente)}</td><td>${inp('obras',o.id,'vendedor',o.vendedor)}</td><td>${inp('obras',o.id,'local',o.local)}</td><td>${inp('obras',o.id,'peca',o.peca)}</td><td>${inp('obras',o.id,'fck',o.fck)}</td><td>${inp('obras',o.id,'slump',o.slump)}</td><td>${inp('obras',o.id,'m3',o.m3,'number')}</td><td>${inp('obras',o.id,'perc',o.perc,'number')}</td><td class="c"><input type="checkbox" data-k="obras" data-i="${o.id}" data-f="bomba" ${o.bomba?'checked':''}></td><td class="x" onclick="del('obras','${o.id}')">×</td></tr>`).join('')}
function prog(){
 const os=S.obras.filter(o=>o.data==UI.data&&o.usina==UI.usina).sort((a,b)=>t2m(a.hora)-t2m(b.hora));
 const m=os.filter(o=>t2m(o.hora)<720),t=os.filter(o=>t2m(o.hora)>=720),sum=l=>l.reduce((a,o)=>a+(+o.m3||0),0),n=UI.nf;
 const th='<tr><th>Hora</th><th>Cliente</th><th>Vendedor</th><th>Local</th><th>Peça</th><th>FCK</th><th>Slump</th><th>m³</th><th>Percurso (min)</th><th>Bomba</th><th></th></tr>';
 const dl=a=>'<datalist id="'+a[0]+'">'+[...new Set(S.obras.map(o=>o[a[1]]).filter(Boolean))].map(v=>`<option value="${e(v)}">`).join('')+'</datalist>';
 const f=(id,v,t='text',x='')=>`<td><input id="nf-${id}" type="${t=='time'?'text':t}" ${t=='time'?'data-t="1" inputmode="numeric" maxlength="5"':''} value="${e(v)}" ${x}></td>`;
 return semana()+timeline()+
 `<table><tr><th colspan="11" style="background:#9DC3E6;color:#000">NOVA OBRA — confira o aviso antes de confirmar</th></tr>${th}<tr class="nf">${f('hora',n.hora,'time')}${f('cliente',n.cliente,'text','list="l-cli"')}${f('vendedor',n.vendedor,'text','list="l-ven"')}${f('local',n.local)}${f('peca',n.peca)}${f('fck',n.fck)}${f('slump',n.slump)}${f('m3',n.m3,'number')}${f('perc',n.perc,'number')}<td class="c"><input id="nf-bomba" type="checkbox" ${n.bomba?'checked':''}></td><td class="c"><button onclick="addObra()">Lançar</button></td></tr></table>${dl(['l-cli','cliente'])}${dl(['l-ven','vendedor'])}
 <div style="margin:6px 0" id="st"></div>
 <div class="sec">MANHÃ — ${sum(m)} m³</div><table>${th}${rowsObras(m)||''}</table>
 <div class="sec gap">TARDE — ${sum(t)} m³</div><table>${th}${rowsObras(t)||''}</table>`}
function fila(tipo){
 const L=S.frota.filter(f=>f.tipo==tipo),rows=S.prod[UI.data+UI.usina]||[];
 return'<div class="fila">'+L.map((f,i)=>{const rs=rows.filter(r=>(tipo=='Bomba'?r.bomba:r.cam)==f.id),lv=rs.map(livreDe).filter(Boolean).sort().pop();
  return`<div class="chip" draggable="true" data-d="${f.id}" style="background:${f.cor};color:${tc(f.cor)}${f.manut?';opacity:.5;text-decoration:line-through':''}">${i+1}º ${e(f.cod)} ${e(f.mot.split('/')[0])} · ${f.manut?'MANUT.':f.entrada+(lv?' · livre '+lv:'')}</div>`}).join('')+'</div>'}
function gerar(auto){
 const k=UI.data+UI.usina,P=S.prod[k]=S.prod[k]||[],os=S.obras.filter(o=>o.data==UI.data&&o.usina==UI.usina);S.pa=S.pa||{};S.pa[k]=1;
 os.forEach(o=>{const n=Math.max(1,Math.ceil(o.m3/8)),ex=P.filter(r=>r.oid==o.id);
  ex.filter(r=>r.j===undefined).forEach((r,i)=>r.j=i);
  for(let j=0;j<n;j++){const v={prog:m2t(t2m(o.hora)+j*gap()),cli:o.cliente,loc:o.local,peca:o.peca,vend:o.vendedor,m3:j<n-1?8:(o.m3-8*(n-1)||8),fck:o.fck,slump:o.slump,perc:o.perc};
   let r=ex.find(x=>x.j===j);if(!r){r={id:uid(),oid:o.id,j,real:'',ped:'',cam:'',bomba:'',livre:'',obs:'',ed:{}};P.push(r)}
   r.ed=r.ed||{};for(const f in v)if(!r.ed[f])r[f]=v[f]}
  ex.filter(r=>r.j>=n&&!(r.cam||r.real||r.ped||r.bomba)).forEach(r=>P.splice(P.indexOf(r),1))});
 for(let i=P.length-1;i>=0;i--){const r=P[i];if(r.oid&&!S.obras.some(o=>o.id==r.oid)&&!(r.cam||r.real||r.ped||r.bomba))P.splice(i,1)}
 if(!(S.man&&S.man[k]))P.sort((a,b)=>t2m(a.prog)-t2m(b.prog));save();if(!auto)render()}
function agora(id){const r=find('prod',id);if(!r)return;const d=new Date();r.real=m2t(d.getHours()*60+d.getMinutes());r.ed=r.ed||{};r.ed.real=1;save();render()}
function autoLivre(id){const r=find('prod',id);if(!r)return;r.livre='';save();render()}
function painel(tipo){
 const L=ordem(tipo,UI.data),rows=S.prod[UI.data+UI.usina]||[],now=dstr(new Date())==UI.data?new Date().getHours()*60+new Date().getMinutes():-1,g={nu:[],li:[],oc:[],mn:[]};
 L.forEach((f,i)=>{const rs=rows.filter(r=>(tipo=='Bomba'?r.bomba:r.cam)==f.id),lv=rs.map(livreDe).filter(Boolean).sort().pop(),o={f,n:i+1,lv};
  if(sit(f,UI.data))g.mn.push(o);else if(!rs.length)g.nu.push(o);else if(now>=0&&lv&&t2m(lv)<=now)g.li.push(o);else g.oc.push(o)});
 g.oc.sort((a,b)=>(a.lv||'').localeCompare(b.lv||''));
 const ch=(o,x)=>`<div class="chip" draggable="true" data-d="${o.f.id}" style="background:${o.f.cor};color:${tc(o.f.cor)}">${o.n}º ${e(o.f.cod)} · ${e(o.f.mot.split('/')[0]||'sem motorista')}${x}</div>`;
 const col=(t,c,l,x)=>`<div class="pc"><div class="ph" style="background:${c}">${t} (${l.length})</div>${l.map(o=>ch(o,x(o))).join('')||'<div class="leg">nenhum</div>'}</div>`;
 return`<div class="pn">${col('AINDA NÃO USADOS','#92D050',g.nu,o=>' · entra '+ent(o.f,UI.data))}${col('JÁ LIBERARAM','#FFFF00',g.li,o=>' · livre desde '+o.lv)}${col('OCUPADOS','#ED7D31',g.oc,o=>' · livre às '+(o.lv||'—'))}${col('AUSENTES / MANUT.','#FF0000',g.mn,o=>' · '+sit(o.f,UI.data))}</div>`}
function prod(){
 const k=UI.data+UI.usina,P=(S.prod[k]||[]),tot=P.reduce((a,r)=>a+(+r.m3||0),0),ac=S.acum[k]||0;
 const now=dstr(new Date())==UI.data?new Date().getHours()*60+new Date().getMinutes():-1;
 const sel=(r,f,tipo)=>{const cur=S.frota.find(x=>x.id==r[f]);return`<td><select data-k="prod" data-i="${r.id}" data-f="${f}" style="${cur?`background:${cur.cor};color:${tc(cur.cor)}`:''}"><option value=""></option>${S.frota.filter(x=>x.tipo==tipo).map(x=>`<option value="${x.id}" ${x.id==r[f]?'selected':''} style="background:${x.cor};color:${tc(x.cor)}">${e(x.cod)} ${e(x.placa)}${x.manut?' (manut.)':''}</option>`).join('')}</select></td>`};
 const rows=P.map(r=>{const cam=S.frota.find(x=>x.id==r.cam),lv=livreDe(r);let bg='';const pend=!cam||!cam.mot;
  if(lv&&now>=0&&r.cam){const d=t2m(lv)-now;bg=d<0?'background:#FF0000;color:#fff':d<=15?'background:#FFFF00':''}
  return`<tr data-r="${r.id}" style="${pend?'background:#F4B183':''}"><td class="hd" draggable="true" style="cursor:grab;white-space:nowrap" title="Arraste para mover a linha">≡<button class="mb" onclick="mv('${r.id}',-1)">▲</button><button class="mb" onclick="mv('${r.id}',1)">▼</button></td><td>${inp('prod',r.id,'prog',r.prog,'time')}</td><td style="white-space:nowrap">${inp('prod',r.id,'real',r.real,'time')}<button class="mb" title="Pegar horário agora" onclick="agora('${r.id}')">⏱</button></td><td>${inp('prod',r.id,'ped',r.ped)}</td><td>${inp('prod',r.id,'cli',r.cli)}</td><td>${inp('prod',r.id,'loc',r.loc)}</td><td>${inp('prod',r.id,'peca',r.peca)}</td><td>${inp('prod',r.id,'vend',r.vend)}</td><td>${inp('prod',r.id,'m3',r.m3,'number')}</td><td>${inp('prod',r.id,'fck',r.fck)}</td><td>${inp('prod',r.id,'slump',r.slump)}</td><td>${inp('prod',r.id,'perc',r.perc,'number')}</td>${sel(r,'cam','Betoneira')}<td style="${cam?`background:${cam.cor};color:${tc(cam.cor)}`:''};white-space:nowrap;padding:4px">${cam&&cam.mot?e(cam.mot)+(sit(cam,UI.data)?' ⚠ '+sit(cam,UI.data):''):'⚠ PENDENTE'}</td>${sel(r,'bomba','Bomba')}<td style="${bg};white-space:nowrap">${inp('prod',r.id,'livre',r.livre||lv,'time','style="font-weight:700"')}${r.livre?`<button class="mb" title="Voltar ao cálculo automático" onclick="autoLivre('${r.id}')">↺</button>`:''}</td><td>${inp('prod',r.id,'obs',r.obs)}</td><td class="x" onclick="del('prod','${r.id}')">×</td></tr>`}).join('');
 return`<div class="tot"><div class="o">TOTAL ${tot.toFixed(1)} m³</div><div class="y">${P.length} cargas</div></div>
 <div class="sec" style="margin-top:0">CAMINHÕES E BOMBAS — arraste um cartão para mudar a ordem de carregamento</div>
 <b style="font-size:11px">BETONEIRAS</b>${painel('Betoneira')}<b style="font-size:11px">BOMBAS</b>${painel('Bomba')}
 <div class="sec">USINA DE PLANALTINA ${UI.usina} <span style="background:#F4B183;padding:0 8px;border:1px solid #333">linha laranja = sem motorista (pendente)</span></div>
 <table><tr><th></th><th>Prog.</th><th>Realizado</th><th>Nº Pedido</th><th>Cliente</th><th>Local concretagem</th><th>Peça</th><th>Vendedor</th><th>M³</th><th>FCK</th><th>Slump</th><th>Perc.</th><th>Betoneira</th><th>Motorista</th><th>Bomba</th><th>Livre às</th><th>Obs.</th><th></th></tr>${rows}</table>
 <div style="margin-top:8px"><button onclick="gerar()">↻ Atualizar da programação</button> <span class="hint">As cargas e horários já vêm da programação. O botão atualiza só o que você não editou à mão.</span> <button onclick="novaLinha()">+ Linha</button> <button onclick="(S.man=S.man||{})[UI.data+UI.usina]=0;gerar()">Ordenar por horário</button> <span class="hint">“Livre às” = saída + 1h + percurso + 1h descarga + percurso de volta. Edite se mudar. Fica amarelo 15 min antes e vermelho se já liberou.</span></div>`}
function eq(){
 const D=UI.data,SIT=['Férias','Banco de hora','Atestado','Falta','Folga'];
 const dia=tipo=>{const O=ordem(tipo,D),P=O.filter(x=>!sit(x,D));return`<table><tr><th>Ordem</th><th>${tipo=='Bomba'?'Motorista bomba / ajudante':'Motorista betoneira'}</th><th>Placa</th><th>Cód.</th><th>Entrada</th><th>Situação no dia</th></tr>`+O.map(f=>{const a=sit(f,D),o=(S.ov[D]||{})[f.id]||{};return`<tr style="background:${a?'#FF9999':'inherit'}"><td class="c">${a?'—':P.indexOf(f)+1}</td><td style="padding:4px">${e(f.mot)||'<i>sem motorista</i>'}</td><td>${inp('frota',f.id,'placa',f.placa)}</td><td>${inp('frota',f.id,'cod',f.cod)}</td><td>${a?'':`<input data-t="1" data-ov="ent" data-i="${f.id}" maxlength="5" inputmode="numeric" value="${e(ent(f,D))}" style="width:62px;text-align:center${o.ent?';background:#FFFF00;font-weight:700':''}">`}</td><td><select data-ov="aus" data-i="${f.id}"><option value="">${a&&!o.aus?e(a)+' (automático)':'Automático'}</option><option value="P" ${o.aus=='P'?'selected':''}>Presente</option>${SIT.map(x=>`<option ${o.aus==x?'selected':''}>${x}</option>`).join('')}</select></td></tr>`}).join('')+'</table>'};
 const cad=tipo=>`<table><tr><th></th><th>Base</th><th>Motorista</th><th>Placa</th><th>Cód.</th><th>Cor</th><th>Manut.</th><th>Ausência</th><th>De</th><th>Até</th><th></th></tr>`+S.frota.filter(f=>f.tipo==tipo).map((f,i)=>`<tr draggable="true" data-d="${f.id}"><td class="c" style="cursor:grab">≡</td><td class="c">${i+1}</td><td>${inp('frota',f.id,'mot',f.mot)}</td><td>${inp('frota',f.id,'placa',f.placa)}</td><td>${inp('frota',f.id,'cod',f.cod)}</td><td class="c"><input type="color" data-k="frota" data-i="${f.id}" data-f="cor" value="${f.cor}" style="width:40px;padding:0"></td><td class="c"><input type="checkbox" data-k="frota" data-i="${f.id}" data-f="manut" ${f.manut?'checked':''}></td><td><select data-k="frota" data-i="${f.id}" data-f="au_t"><option value=""></option>${SIT.map(x=>`<option ${f.au_t==x?'selected':''}>${x}</option>`).join('')}</select></td><td>${inp('frota',f.id,'au_de',f.au_de||'','date')}</td><td>${inp('frota',f.id,'au_ate',f.au_ate||'','date')}</td><td class="x" onclick="del('frota','${f.id}')">×</td></tr>`).join('')+'</table>';
 const sl=t=>(S.rod.slots[t]||[]).join(', ');
 return`<div style="margin-bottom:6px"><button onclick="exportXlsx()">📊 Baixar escala em Excel</button> <button onclick="delete S.ov[UI.data];save();render()">Desfazer ajustes do dia</button> <span class="hint">Escala do dia ${D.split('-').reverse().join('/')} (muda com a data do topo). Amarelo = horário ajustado por você.</span></div>
 <div class="sec" style="margin-top:0">BOMBAS — escala do dia</div>${dia('Bomba')}
 <div class="sec">BETONEIRAS — escala do dia</div>${dia('Betoneira')}
 <div class="sec">RODÍZIO (automático)</div>
 <table style="width:auto"><tr><th>Sentido</th><th>Horários de entrada — Bombas</th><th>Horários de entrada — Betoneiras</th></tr><tr><td><select data-cfg="sent"><option value="1" ${S.cfg.sent>0?'selected':''}>1º de hoje vira 2º amanhã (o último sobe p/ 1º)</option><option value="-1" ${S.cfg.sent<0?'selected':''}>1º de hoje vai para o fim amanhã</option></select></td><td><input data-slot="Bomba" value="${e(sl('Bomba'))}" style="min-width:200px"></td><td><input data-slot="Betoneira" value="${e(sl('Betoneira'))}" style="min-width:260px"></td></tr></table>
 <div style="margin:4px 0">Dias de trabalho: ${[1,2,3,4,5,6,0].map(n=>`<label style="margin-right:8px"><input type="checkbox" data-dia="${n}" ${S.cfg.dias.includes(n)?'checked':''}> ${DIAS[n]}</label>`).join('')}</div>
 <div class="hint" style="margin:4px 0">A ordem do cadastro vale em ${S.rod.base.split('-').reverse().join('/')} e gira uma posição a cada dia de trabalho. Os horários acompanham a posição (1º recebe o 1º horário...). Quem está de férias, banco de hora, atestado, falta ou manutenção sai da fila do dia e os demais sobem.</div>
 <button onclick="fixarBase()">Usar a escala de ${D.split('-').reverse().join('/')} como nova base</button>
 <div class="sec">CADASTRO — BOMBAS (arraste ≡ para mudar a ordem base)</div>${cad('Bomba')}<button onclick="addVeic('Bomba')">+ Bomba</button>
 <div class="sec">CADASTRO — BETONEIRAS</div>${cad('Betoneira')}<button onclick="addVeic('Betoneira')">+ Betoneira</button>
 <div class="sec">PAZEIRO / PROGRAMAÇÃO / FÉRIAS / BANCO DE HORA</div>
 <table><tr><th>Função</th><th>Nome</th><th>Horário</th><th></th></tr>${S.staff.map(s=>`<tr><td>${inp('staff',s.id,'cat',s.cat)}</td><td>${inp('staff',s.id,'nome',s.nome)}</td><td>${inp('staff',s.id,'hora',s.hora,'time')}</td><td class="x" onclick="del('staff','${s.id}')">×</td></tr>`).join('')}</table>
 <button onclick="S.staff.push({id:uid(),cat:'',nome:'',hora:''});save();render()">+ Pessoa</button> <span class="hint">Nome em “Férias” ou “Banco de hora” igual ao de um motorista = ausente automático.</span>
 <div class="sec">CAPACIDADE E BACKUP</div>
 <table style="width:auto"><tr><th>m³/h da central</th><th>Ida fixa (min)</th><th>Descarga (min)</th></tr><tr><td><input type="number" data-cfg="mh" value="${S.cfg.mh}"></td><td><input type="number" data-cfg="ida" value="${S.cfg.ida}"></td><td><input type="number" data-cfg="desc" value="${S.cfg.desc}"></td></tr></table>
 <div class="hint" style="margin:4px 0">Intervalo entre cargas: ${gap()} min (8 m³ ÷ m³/h). Ciclo do caminhão = ida fixa + descarga + 2 × percurso.</div>
 <button onclick="backup()">Baixar backup</button> <label class="hint"><button onclick="this.nextElementSibling.click()">Restaurar backup</button><input type="file" accept=".json" hidden onchange="restaurar(this.files[0])"></label>`}
function render(){if(UI.tab=='prod'&&!(S.pa&&S.pa[UI.data+UI.usina])&&!(S.prod[UI.data+UI.usina]||[]).length&&S.obras.some(o=>o.data==UI.data&&o.usina==UI.usina))gerar(true);head();$('#app').innerHTML=UI.tab=='prog'?prog():UI.tab=='prod'?prod():eq();if(UI.tab=='prog')aviso()}
render();
</script></body></html>
