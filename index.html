 const cadM=tipo=>`<table><tr><th></th><th>Base</th><th>Motorista</th><th>Ausência</th><th>De</th><th>Até</th><th></th></tr>`+S.mots.filter(f=>f.tipo==tipo).map((f,i)=>`<tr draggable="true" data-d="${f.id}"><td class="c" style="cursor:grab">≡</td><td class="c">${i+1}</td><td>${inp('mots',f.id,'nome',f.nome)}</td><td><select data-k="mots" data-i="${f.id}" data-f="au_t"><option value=""></option>${SIT.map(x=>`<option ${f.au_t==x?'selected':''}>${x}</option>`).join('')}</select></td><td>${inp('mots',f.id,'au_de',f.au_de||'','date')}</td><td>${inp('mots',f.id,'au_ate',f.au_ate||'','date')}</td><td class="x" onclick="del('mots','${f.id}')">×</td></tr>`).join('')+`</table><button onclick="addMot('${tipo}')">+ Motorista</button>`;
 const cadV=tipo=>`<table><tr><th>Cód.</th><th>Placa</th><th>Cor</th><th>Manutenção</th><th></th></tr>`+vs(tipo).map(f=>`<tr style="background:${f.manut?'#FF9999':'inherit'}"><td>${inp('frota',f.id,'cod',f.cod)}</td><td>${inp('frota',f.id,'placa',f.placa)}</td><td class="c"><input type="color" data-k="frota" data-i="${f.id}" data-f="cor" value="${f.cor}" style="width:40px;padding:0"></td><td class="c"><input type="checkbox" data-k="frota" data-i="${f.id}" data-f="manut" ${f.manut?'checked':''}></td><td class="x" onclick="del('frota','${f.id}')">×</td></tr>`).join('')+`</table><button onclick="addVeic('${tipo}')">+ Veículo</button>`;
 const dt=(n,t,b)=>`<details ${UI.op[n]?'open':''} ontoggle="UI.op.${n}=this.open"><summary class="sec" style="cursor:pointer">${t}</summary>${b}</details>`;
 const sl=t=>(S.rod.slots[t]||[]).join(', '),br=D.split('-').reverse().join('/');
 return`<div class="tip">Passo 2: escolha quem entra em 1º, 2º, 3º (pela lista ou ▲▼) e o veículo de cada motorista. A ordem vale para os próximos dias, que giram sozinhos.</div><div style="margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap"><button onclick="exportXlsx()">📊 Baixar escala em Excel</button> <button onclick="delete S.ov[UI.data];delete S.esc[UI.data];save();render()">Voltar o dia ao automático</button> <button onclick="if(confirm('Apagar a escala atual (motoristas, veículos e ordem) e recomeçar pela planilha?')){resetPlanilha(UI.data);save();render()}">Resetar escala (planilha)</button> </div>
 <div class="sec" style="margin-top:0">BOMBAS</div>${dia('Bomba')}
 <div class="sec">BETONEIRAS</div>${dia('Betoneira')}
 ${dt('rod','RODÍZIO — sentido, horários e dias de trabalho',`<table style="width:auto"><tr><th>Sentido</th><th>Horários de entrada — Bombas</th><th>Horários de entrada — Betoneiras</th></tr><tr><td><select data-cfg="sent"><option value="1" ${S.cfg.sent>0?'selected':''}>1º de hoje vira 2º amanhã (o último sobe p/ 1º)</option><option value="-1" ${S.cfg.sent<0?'selected':''}>1º de hoje vai para o fim amanhã</option></select></td><td><input data-slot="Bomba" value="${e(sl('Bomba'))}" style="min-width:200px"></td><td><input data-slot="Betoneira" value="${e(sl('Betoneira'))}" style="min-width:260px"></td></tr></table><div style="margin:4px 0">Dias de trabalho: ${[1,2,3,4,5,6,0].map(n=>`<label style="margin-right:8px"><input type="checkbox" data-dia="${n}" ${S.cfg.dias.includes(n)?'checked':''}> ${DIAS[n]}</label>`).join('')}</div><div class="hint" style="margin:4px 0">A ordem que você escala num dia vale para ele e vira o ponto de partida: nos dias seguintes a escala gira sozinha (uma posição por dia de trabalho). Os horários acompanham a posição. Quem está ausente sai da fila e os demais sobem.</div>`)}
 ${dt('cadm','MOTORISTAS — ordem base e ausências','<b>Bombas</b> (arraste ≡ para mudar a ordem base)'+cadM('Bomba')+'<b>Betoneiras</b>'+cadM('Betoneira'))}
 ${dt('cadv','VEÍCULOS — placa, código e manutenção','<b>Bombas</b>'+cadV('Bomba')+'<b>Betoneiras</b>'+cadV('Betoneira'))}
 ${dt('loc','LOCAIS E DISTÂNCIAS',`${locList()}<div class="hint">Lista de regiões (não precisa do endereço exato): escolha o Local na obra e o percurso preenche sozinho. Os tempos com ≈ são estimativas minhas: corrija com a sua experiência e o ≈ some. Na usina GO os tempos começam vazios.</div><b>Minutos saindo da usina ${UI.usina}</b><table style="width:auto"><tr><th>Local</th><th>Grupo</th><th>Min da usina</th><th></th></tr>${LL(UI.usina).map(x=>`<tr><td>${inp('loc'+UI.usina,x.id,'n',x.n)}</td><td><select data-k="loc${UI.usina}" data-i="${x.id}" data-f="g"><option value="P">Planaltina</option><option value="F" ${x.g=='F'?'selected':''}>Fora de Planaltina</option></select></td><td style="white-space:nowrap">${inp('loc'+UI.usina,x.id,'m',x.m,'number')}${x.est?' <span title="tempo estimado: confira e ajuste">≈</span>':''}</td><td class="x" onclick="del('loc${UI.usina}','${x.id}')">×</td></tr>`).join('')}</table><button onclick="S['loc'+UI.usina].push({id:uid(),n:'',g:'P',m:15});save();render()">+ Local</button><br><b>Distância entre dois locais</b> <span class="hint">(opcional: mostra a economia quando a bomba vai direto de uma obra para outra)</span><table style="width:auto"><tr><th>Local A</th><th>Local B</th><th>Min</th><th></th></tr>${S.par.map(x=>`<tr><td>${inp('par',x.id,'a',x.a,'text','list="l-loc"')}</td><td>${inp('par',x.id,'b',x.b,'text','list="l-loc"')}</td><td>${inp('par',x.id,'m',x.m,'number')}</td><td class="x" onclick="del('par','${x.id}')">×</td></tr>`).join('')}</table><button onclick="S.par.push({id:uid(),a:'',b:'',m:10});save();render()">+ Distância</button>`)}
 ${dt('out','PAZEIRO / PROGRAMAÇÃO / FÉRIAS / BANCO DE HORA',`<table><tr><th>Função</th><th>Nome</th><th>Horário</th><th></th></tr>${S.staff.map(s=>`<tr><td>${inp('staff',s.id,'cat',s.cat)}</td><td>${inp('staff',s.id,'nome',s.nome)}</td><td>${inp('staff',s.id,'hora',s.hora,'time')}</td><td class="x" onclick="del('staff','${s.id}')">×</td></tr>`).join('')}</table><button onclick="S.staff.push({id:uid(),cat:'',nome:'',hora:''});save();render()">+ Pessoa</button> <span class="hint">Nome em “Férias” ou “Banco de hora” igual ao de um motorista = ausente automático.</span>`)}
 ${dt('cap','CAPACIDADE E BACKUP',`<table style="width:auto"><tr><th>m³/h da central</th><th>Ida fixa (min)</th><th>Descarga (min)</th><th>Carregar (min) — livre às</th><th>Descarregar (min) — livre às</th></tr><tr><td><input type="number" data-cfg="mh" value="${S.cfg.mh}"></td><td><input type="number" data-cfg="ida" value="${S.cfg.ida}"></td><td><input type="number" data-cfg="desc" value="${S.cfg.desc}"></td><td><input type="number" data-cfg="lc" value="${S.cfg.lc}"></td><td><input type="number" data-cfg="ld" value="${S.cfg.ld}"></td></tr></table><table style="width:auto"><tr><th>Vazão da bomba (m³/h)</th><th>Montar (min)</th><th>Lavar (min)</th></tr><tr><td><input type="number" data-cfg="bv" value="${S.cfg.bv}"></td><td><input type="number" data-cfg="bm" value="${S.cfg.bm}"></td><td><input type="number" data-cfg="bl" value="${S.cfg.bl}"></td></tr></table><div class="hint" style="margin:4px 0">Intervalo entre cargas: ${gap()} min (8 m³ ÷ m³/h). Ciclo (cabe/apertado) = ida fixa + descarga + 2 × percurso.</div><button onclick="backup()">Baixar backup</button> <label class="hint"><button onclick="this.nextElementSibling.click()">Restaurar backup</button><input type="file" accept=".json" hidden onchange="restaurar(this.files[0])"></label>`)}`}
function render(){if(SB.url&&window.supabase&&!me){loginView();return}if(UI.tab=='prod')gerar(true);head();$('#app').innerHTML=UI.tab=='prog'?prog():UI.tab=='prod'?prod():eq();if(UI.tab=='prog')aviso();if(!UI.hs){UI.hs=1;try{if(!localStorage.getItem('usina_help'))ajuda()}catch(_){}}}
// ---------- sincronização online (Supabase) ----------
let sb=null,me=null,ch=null,pt=null,rt=null,SNAP={},ST='',LIM='',OM={};
const ORD=['prod','mots','frota'],KV=['cfg','rod','esc','asg','ov','man','pa','acum','rst','cf2','clr1','locSeed'];
function sync(t){ST=t;const b=$('#sy');if(b)b.textContent=t}
function sbar(){return me?`<span style="margin-left:12px;font-size:12px"><span id="sy">${e(ST)}</span> · ${e(me.email)} <button onclick="sair()">Sair</button></span>`:''}
function items(){
 const m={},put=(kind,id,data,dia)=>m[kind+':'+id]={kind,id,data,dia};
 ['obras','frota','mots','staff','locDF','locGO','par'].forEach(k=>(S[k]||[]).forEach((x,i)=>{const o=ORD.includes(k);if(o)OM[k+':'+x.id]=i;put(k,x.id,o?{d:x,o:i}:{d:x},k=='obras'?x.data:null)}));
 Object.entries(S.prod||{}).forEach(([k,a])=>a.forEach((r,i)=>{OM['prod:'+r.id]=i;put('prod',r.id,{d:r,k,o:i},k.slice(0,10))}));
 KV.forEach(k=>{if(S[k]!==undefined)put('kv',k,{v:S[k]},null)});
 return m}
function aplica(kind,id,data,del){
 if(kind=='kv'){if(del)delete S[id];else S[id]=data.v;return}
 const key=kind+':'+id,srt=a=>a.sort((x,y)=>(OM[kind+':'+x.id]??1e9)-(OM[kind+':'+y.id]??1e9));
 if(kind=='prod'){for(const k in S.prod){const i=S.prod[k].findIndex(r=>r.id==id);if(i>=0)S.prod[k].splice(i,1)}
  if(del){delete OM[key];return}OM[key]=data.o;const a=S.prod[data.k]=S.prod[data.k]||[];a.push(data.d);srt(a);return}
 const a=S[kind]=S[kind]||[],i=a.findIndex(x=>x.id==id);
 if(del){if(i>=0)a.splice(i,1);delete OM[key];return}
 if(i>=0)a[i]=data.d;else a.push(data.d);
 if(ORD.includes(kind)){OM[key]=data.o;srt(a)}}
function push(now){if(!sb||!me)return;clearTimeout(pt);if(now)doPush();else pt=setTimeout(doPush,700)}
async function doPush(){
 const cur=items(),up=[],del={};
 for(const k in cur)if(SNAP[k]!==JSON.stringify(cur[k].data))up.push(cur[k]);
 for(const k in SNAP)if(!(k in cur)){const i=k.indexOf(':');(del[k.slice(0,i)]=del[k.slice(0,i)]||[]).push(k.slice(i+1))}
 if(!up.length&&!Object.keys(del).length)return;
 sync('salvando…');
 const falha=m=>{sync('sem conexão ('+m+') — tentando de novo');clearTimeout(pt);pt=setTimeout(doPush,5000)};
 for(let i=0;i<up.length;i+=500){const{error}=await sb.from('items').upsert(up.slice(i,i+500).map(u=>({kind:u.kind,id:u.id,data:u.data,dia:u.dia||null})),{onConflict:'kind,id'});if(error)return falha(error.message)}
 for(const kd in del){const{error}=await sb.from('items').delete().eq('kind',kd).in('id',del[kd]);if(error)return falha(error.message)}
 up.forEach(u=>SNAP[u.kind+':'+u.id]=JSON.stringify(u.data));for(const kd in del)del[kd].forEach(id=>delete SNAP[kd+':'+id]);
 sync('salvo')}
async function carrega(){
 sync('carregando…');LIM=dstr(new Date(Date.now()-120*864e5));const rows=[];
 for(let a=0;;a+=1000){const{data,error}=await sb.from('items').select('kind,id,data,dia').or('dia.is.null,dia.gte.'+LIM).order('kind').order('id').range(a,a+999);if(error){sync('erro: '+error.message);render();return}rows.push(...data);if(data.length<1000)break}
 if(rows.length){S={cfg:{},frota:[],mots:[],staff:[],locDF:[],locGO:[],par:[],obras:[],prod:{},acum:{}};OM={};rows.forEach(r=>aplica(r.kind,r.id,r.data,false));mig();try{localStorage.setItem(K,JSON.stringify(S))}catch(_){}SNAP={};const c=items();for(const k in c)SNAP[k]=JSON.stringify(c[k].data)}
 else{SNAP={};await doPush()}
 assina();sync('online');render()}
function assina(){
 if(ch)sb.removeChannel(ch);
 ch=sb.channel('items').on('postgres_changes',{event:'*',schema:'public',table:'items'},p=>{
  const r=p.eventType=='DELETE'?p.old:p.new,key=r.kind+':'+r.id;
  if(p.eventType=='DELETE'){if(!(key in SNAP))return;aplica(r.kind,r.id,null,true);delete SNAP[key]}
  else{const x=JSON.stringify(r.data);if(SNAP[key]===x||(r.dia&&r.dia<LIM))return;aplica(r.kind,r.id,r.data,false);SNAP[key]=x}
  try{localStorage.setItem(K,JSON.stringify(S))}catch(_){}
  clearTimeout(rt);rt=setTimeout(()=>{mig();rr()},150)}).subscribe(st=>{if(st=='SUBSCRIBED')sync('online')})}
function loginView(){$('#ban').textContent='Usina de Planaltina';$('#bar').innerHTML='';$('#app').innerHTML=`<div class="card" style="max-width:340px;margin:40px auto"><div class="ct">Entrar</div><div class="grid" style="grid-template-columns:1fr"><label class="fld"><span>E-mail</span><input id="lg-e" type="email"></label><label class="fld"><span>Senha</span><input id="lg-s" type="password" onkeydown="if(event.key=='Enter')entrar()"></label></div><button class="pri" style="width:100%" onclick="entrar()">Entrar</button><div id="lg-m" style="color:#dc2626;margin-top:8px"></div></div>`}
async function entrar(){const{data,error}=await sb.auth.signInWithPassword({email:$('#lg-e').value.trim(),password:$('#lg-s').value});if(error){$('#lg-m').textContent='E-mail ou senha incorretos.';return}me=data.user;carrega()}
async function sair(){await sb.auth.signOut();me=null;if(ch){sb.removeChannel(ch);ch=null}render()}
function start(){if(SB.url&&window.supabase){sb=window.supabase.createClient(SB.url,SB.key);sb.auth.getSession().then(({data})=>{if(data.session){me=data.session.user;carrega()}else render()})}else render()}
start();
</script></body></html>
